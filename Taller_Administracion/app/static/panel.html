  async function renderProductos() {
    // Sesion 2026-09-15: el color deja de ser el producto (ver
    // Documentacion/aladin_cambio BBDD.txt) -- ahora el producto tiene un
    // codigo (3 car.) y un LED OPCIONAL. estado.colores viene de /colores
    // (catalogo con alta/baja/RGB propios, pestaña Colores).
    const [productos, colores] = await Promise.all([api("/productos"), api("/colores")]);
    const usados = {};
    productos.filter((p) => p.activo && p.id_led).forEach((p) => { usados[p.id_led] = p.id; });

    // Lista desplegable en vez de bolitas de click (sesion 2026-09-15, a
    // peticion del usuario: con muchos colores las bolitas no escalan).
    // Un <option> no puede llevar un <span> de color de verdad (el
    // navegador solo pinta el texto), asi que la "bolita" es un "●"
    // delante del nombre, coloreado con el mismo style="color:" del
    // option -- eso si lo respetan los navegadores. El propio <select>
    // tambien se colorea al elegir, para verse igual cerrado que abierto.
    function selectLed(idAttr, idLedSeleccionado, idProductoActual) {
      const rgbDe = (c) => `rgb(${c.r},${c.g},${c.b})`;
      const opciones = colores.filter((c) => c.activo).map((c) => {
        const usadoPorOtro = usados[c.id] && usados[c.id] !== idProductoActual;
        const etiqueta = `● ${c.nombre} (${c.codigo})${c.fisico ? "" : " · solo LED"}${usadoPorOtro ? " -- en uso" : ""}`;
        return `<option value="${c.id}" data-rgb="${rgbDe(c)}" style="color:${rgbDe(c)}"
          ${c.id === idLedSeleccionado ? "selected" : ""} ${usadoPorOtro ? "disabled" : ""}>${escapeHtml(etiqueta)}</option>`;
      }).join("");
      const seleccionado = colores.find((c) => c.id === idLedSeleccionado);
      const colorInicial = seleccionado ? rgbDe(seleccionado) : "inherit";
      return `<select id="${idAttr}" style="color:${colorInicial}" onchange="
          this.style.color = this.selectedOptions[0].dataset.rgb || 'inherit';
        "><option value="" style="color:inherit" ${idLedSeleccionado === null ? "selected" : ""}>${t("sin_led_op", "Sin LED")}</option>${opciones}</select>`;
    }

    const cont = document.getElementById("contenido");
    cont.innerHTML = `
      <h2>${t("tab_productos", "Productos")}</h2>
      <p class="ayuda">${t("ayuda_productos", 'El catálogo de qué se fabrica en general — p.ej. "Tornillos" o "Tuercas". Cada producto lleva un código corto y, si quieres, un <b>LED</b> asignado: es solo para verlo encendido de ese color en el brazo mientras lo fabrica, decorativo, no hace falta para que la producción funcione (un producto sin LED se fabrica exactamente igual). El "Grupo cadena" dice qué línea de producción fabrica ese producto por defecto cuando entra un pedido nuevo.')}</p>
      <form class="alta" id="form-nuevo-producto">
        <input id="pr-nombre" placeholder="${t("nombre_del_producto", "Nombre del producto")}" />
        <input id="pr-codigo" placeholder="${t("codigo_3", "Código (3)")}" maxlength="3" style="width:4.5em;text-transform:uppercase" />
        <span title="${t("titulo_led_opcional", "LED opcional: enciende este producto en el Loader/Sorter reales. Puedes no asignar ninguno.")}">${selectLed("pr-led-nuevo", null, null)}</span>
        <label title="${t("titulo_grupo_cadena", "Grupo Cadena que fabrica este producto: sus pedidos nuevos nacen con este Nº Máquina, y solo los fabrican las cadenas de ese mismo grupo. 0 = cualquier cadena. Buena práctica: no uses para grupos los números que ya tengan las máquinas (p. ej. máquinas 1-49, grupos 50-99).")}">${t("grupo_cadena", "Grupo cadena")}
          <input id="pr-grupo" type="number" min="0" max="99" value="0" style="width:4em" /></label>
        <button type="submit">${t("crear", "Crear")}</button>
        <span id="pr-error" style="color:#c0392b"></span>
      </form>
      <table>
        <thead><tr><th>${t("th_id", "ID")}</th><th>${t("th_nombre", "Nombre")}</th><th>${t("th_codigo", "Código")}</th><th>${t("th_led", "LED")}</th><th title="${t("titulo_grupo_cadena_corto", "Los pedidos nuevos de este producto nacen con este Nº Máquina (0 = cualquier cadena). No cambia los pedidos ya existentes.")}">${t("grupo_cadena", "Grupo cadena")}</th><th>${t("th_activo", "Activo")}</th><th></th></tr></thead>
        <tbody>${productos.map((p) => `
          <tr data-fila-producto="${p.id}">
            <td>${p.id}</td>
            <td><input value="${escapeHtml(p.nombre)}" data-campo="nombre" /></td>
            <td><input value="${escapeHtml(p.codigo)}" data-campo="codigo" maxlength="3" style="width:4.5em;text-transform:uppercase" /></td>
            <td>${selectLed(`pr-led-${p.id}`, p.id_led, p.id)}</td>
            <td><input type="number" min="0" max="99" value="${p.grupo_cadena || 0}" data-campo="grupo_cadena" style="width:4em" /></td>
            <td><input type="checkbox" data-campo="activo" ${p.activo ? "checked" : ""} /></td>
            <td><button data-guardar="${p.id}">${t("guardar", "Guardar")}</button></td>
          </tr>`).join("")}</tbody>
      </table>`;

    document.getElementById("form-nuevo-producto").onsubmit = async (ev) => {
      ev.preventDefault();
      const nombre = document.getElementById("pr-nombre").value;
      const codigo = document.getElementById("pr-codigo").value.toUpperCase();
      try {
        const grupo_cadena = parseInt(document.getElementById("pr-grupo").value || "0", 10);
        if (Number.isNaN(grupo_cadena)) throw new Error(t("grupo_cadena_no_valido", "Grupo cadena no válido."));

          await api(`/productos/${btn.dataset.guardar}`, { method: "PATCH", body: JSON.stringify({ nombre, codigo, activo, grupo_cadena, id_led }) });
          await cargarPaleta();
          renderProductos();
        } catch (e) { avisar(e.message); }
      };
    });

  async function renderSubproductos() {
    const [subproductos, productos] = await Promise.all([api("/subproductos"), api("/productos")]);
    const productoPorId = {};
    productos.forEach((p) => { productoPorId[p.id] = p; });
    const cont = document.getElementById("contenido");
    cont.innerHTML = `
      <h2>${t("tab_subproductos", "Subproductos")}</h2>
      <p class="ayuda">${t("ayuda_subproductos", 'Las variantes concretas dentro de un producto — por ejemplo, dentro de "Tornillos" puedes tener "Tornillo 10mm" y "Tornillo 20mm" como subproductos distintos. Es lo que de verdad se pide en un pedido (no el producto suelto). El código completo, el que identifica la pieza del todo, se calcula solo juntando el código del producto y el del subproducto — no hace falta escribirlo tú. El <b>precio</b> (en euros, sin IVA) y el <b>IVA</b> se copian a cada pedido en el momento de pedirlo: si luego cambias la tarifa, los pedidos ya hechos y sus albaranes conservan el precio de entonces.')}</p>
      <form class="alta" id="form-nuevo-subproducto">
        <select id="sp-producto">${productos.filter((p) => p.activo).map((p) => `<option value="${p.id}">${escapeHtml(p.nombre)} (${escapeHtml(p.codigo)})</option>`).join("")}</select>
        <input id="sp-nombre" placeholder="${t("nombre_ejemplo_subproducto", "Nombre (p.ej. Tornillo 10mm)")}" />
        <input id="sp-codigo" placeholder="${t("codigo_4", "Código (4)")}" maxlength="4" style="width:5em;text-transform:uppercase" />
        <input id="sp-precio" type="number" min="0" step="0.01" placeholder="${t("precio_euros", "Precio €")}" style="width:6em" />
        <input id="sp-iva" type="number" min="0" max="100" value="21" title="${t("th_iva_pct", "IVA %")}" style="width:4em" />
        <button type="submit">${t("crear", "Crear")}</button>
        <span id="sp-error" style="color:#c0392b"></span>
      </form>
      <table>
        <thead><tr><th>${t("th_id", "ID")}</th><th>${t("th_producto", "Producto")}</th><th>${t("th_nombre", "Nombre")}</th><th>${t("th_codigo", "Código")}</th><th>${t("th_codigo_completo", "Código completo")}</th><th>${t("th_precio_eur", "Precio €")}</th><th>${t("th_iva_pct", "IVA %")}</th><th>${t("th_activo", "Activo")}</th><th></th></tr></thead>
        <tbody>${subproductos.map((s) => `
          <tr data-fila-subproducto="${s.id}">
            <td>${s.id}</td>
            <td>${escapeHtml((productoPorId[s.producto_id] || {}).nombre || "?")}</td>
            <td><input value="${escapeHtml(s.nombre)}" data-campo="nombre" /></td>
            <td><input value="${escapeHtml(s.codigo)}" data-campo="codigo" maxlength="4" style="width:5em;text-transform:uppercase" /></td>
            <td><code>${escapeHtml(s.codigo_completo)}</code></td>
            <td><input type="number" min="0" step="0.01" data-campo="precio" value="${(s.precio_centimos / 100).toFixed(2)}" style="width:6em" /></td>
            <td><input type="number" min="0" max="100" data-campo="iva" value="${s.iva_porcentaje}" style="width:4em" /></td>
            <td><input type="checkbox" data-campo="activo" ${s.activo ? "checked" : ""} /></td>
            <td><button data-guardar="${s.id}">${t("guardar", "Guardar")}</button></td>
          </tr>`).join("")}</tbody>
      </table>`;
    document.getElementById("form-nuevo-subproducto").onsubmit = async (ev) => {
      ev.preventDefault();
      try {
        const producto_id = parseInt(document.getElementById("sp-producto").value, 10);
        const nombre = document.getElementById("sp-nombre").value;
        const codigo = document.getElementById("sp-codigo").value.toUpperCase();
        const precio_centimos = centimosDeTexto(document.getElementById("sp-precio").value);
        const iva_porcentaje = parseInt(document.getElementById("sp-iva").value, 10);
        await api("/subproductos", { method: "POST", body: JSON.stringify({ producto_id, nombre, codigo, precio_centimos, iva_porcentaje: Number.isFinite(iva_porcentaje) ? iva_porcentaje : 21 }) });
        renderSubproductos();
      } catch (e) { document.getElementById("sp-error").textContent = e.message; }
    };
    cont.querySelectorAll("[data-guardar]").forEach((btn) => {
      btn.onclick = async () => {
        const fila = cont.querySelector(`tr[data-fila-subproducto="${btn.dataset.guardar}"]`);
        const nombre = fila.querySelector('[data-campo="nombre"]').value;
        const codigo = fila.querySelector('[data-campo="codigo"]').value.toUpperCase();
        const activo = fila.querySelector('[data-campo="activo"]').checked;
        const precio_centimos = centimosDeTexto(fila.querySelector('[data-campo="precio"]').value);
        const iva_porcentaje = parseInt(fila.querySelector('[data-campo="iva"]').value, 10);
        try {
          await api(`/subproductos/${btn.dataset.guardar}`, { method: "PATCH", body: JSON.stringify({ nombre, codigo, activo, precio_centimos, iva_porcentaje: Number.isFinite(iva_porcentaje) ? iva_porcentaje : 21 }) });
          renderSubproductos();
        } catch (e) { avisar(e.message); }
      };
    });
  }

  // --------------------------------------------------------------- paquetes

  async function renderPaquetes() {
    const [paquetes, subproductos] = await Promise.all([api("/paquetes"), api("/subproductos")]);
    const cont = document.getElementById("contenido");
    const filasComponente = () => `
      <div class="fila-componente" style="display:flex;gap:6px;margin:3px 0">
        <select data-comp-subproducto>${subproductos.filter((s) => s.activo).map((s) => `<option value="${s.id}">${escapeHtml(s.codigo_completo)} · ${escapeHtml(s.nombre)}</option>`).join("")}</select>
        <input data-comp-cantidad type="number" min="1" value="1" style="width:5em" placeholder="${t("th_cantidad", "Cantidad")}" />
        <button type="button" data-quitar-fila>✕</button>
      </div>`;
    cont.innerHTML = `
      <h2>${t("tab_paquetes", "Paquetes")}</h2>
      <p class="ayuda">${t("ayuda_paquetes", 'Un pack cerrado de varias piezas a la vez — por ejemplo, "Paquete de 10" podría llevar 10 tornillos + 10 tuercas + 10 arandelas. Cada paquete puede tener un <b>precio propio</b> (por paquete, sin IVA): se cobra ese precio y no la suma de sus productos, y en el albarán y la factura sale una línea del paquete con lo que lleva debajo, sin precio. Sin precio (vacío), se cobra la suma de sus productos. Un paquete se entrega siempre <b>entero</b>. Los paquetes nunca guardan stock propio: en cuanto alguien lo pide, por debajo se crea un pedido normal de cada pieza que lo compone, y esos sí que se fabrican/sirven como cualquier otro pedido.')}</p>
      <form class="alta" id="form-nuevo-paquete" style="flex-direction:column;align-items:flex-start">
        <div style="display:flex;gap:8px">
          <input id="pq-nombre" placeholder="${t("nombre_del_paquete", "Nombre del paquete")}" />
          <input id="pq-codigo" placeholder="${t("th_codigo", "Código")}" style="width:6em;text-transform:uppercase" />
          <input id="pq-precio" type="number" min="0" step="0.01" placeholder="${t("precio_eur_vacio_suma", "Precio € (vacío = suma)")}" style="width:11em" title="${t("titulo_precio_paquete_vacio", "Precio de UN paquete, sin IVA. Vacío: se cobra la suma de sus productos")}" />
          <input id="pq-iva" type="number" min="0" max="100" value="21" title="${t("th_iva_pct", "IVA %")}" style="width:4em" />
        </div>
        <div id="pq-componentes">${filasComponente()}</div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button type="button" id="pq-anadir-fila">${t("mas_componente", "+ componente")}</button>
          <button type="submit">${t("crear_paquete", "Crear paquete")}</button>
        </div>
        <span id="pq-error" style="color:#c0392b"></span>
      </form>
      <table>
        <thead><tr><th>${t("th_id", "ID")}</th><th>${t("th_nombre", "Nombre")}</th><th>${t("th_codigo", "Código")}</th><th>${t("th_componentes", "Componentes")}</th><th>${t("th_precio_eur", "Precio €")} <small style="font-weight:normal">(${t("vacio_igual_suma", "vacío = suma")})</small></th><th>${t("th_iva_pct", "IVA %")}</th><th>${t("th_activo", "Activo")}</th><th></th></tr></thead>
        <tbody>${paquetes.map((pq) => `
          <tr data-fila-paquete="${pq.id}">
            <td>${pq.id}</td>
            <td><input value="${escapeHtml(pq.nombre)}" data-campo="nombre" /></td>
            <td><input value="${escapeHtml(pq.codigo)}" data-campo="codigo" style="width:6em;text-transform:uppercase" /></td>
            <td>${pq.componentes.map((c) => `${escapeHtml(c.subproducto.nombre)} x${c.cantidad}`).join(", ")}</td>
            <td><input type="number" min="0" step="0.01" data-campo="precio" value="${pq.precio_centimos === null ? "" : (pq.precio_centimos / 100).toFixed(2)}" placeholder="${t("suma", "suma")}" style="width:7em" /></td>
            <td><input type="number" min="0" max="100" data-campo="iva" value="${pq.iva_porcentaje}" style="width:4em" /></td>
            <td><input type="checkbox" data-campo="activo" ${pq.activo ? "checked" : ""} /></td>
            <td><button data-guardar="${pq.id}">${t("guardar", "Guardar")}</button></td>
          </tr>`).join("")}</tbody>
      </table>`;

    function activarFila(fila) {
      fila.querySelector("[data-quitar-fila]").onclick = () => {
        if (document.querySelectorAll(".fila-componente").length > 1) fila.remove();
      };
    }
    document.querySelectorAll(".fila-componente").forEach(activarFila);
    document.getElementById("pq-anadir-fila").onclick = () => {
      const div = document.createElement("div");
      div.innerHTML = filasComponente();
      const nueva = div.firstElementChild;
      document.getElementById("pq-componentes").appendChild(nueva);
      activarFila(nueva);
    };
    document.getElementById("form-nuevo-paquete").onsubmit = async (ev) => {
      ev.preventDefault();
      try {
        const nombre = document.getElementById("pq-nombre").value;
        const codigo = document.getElementById("pq-codigo").value.toUpperCase();
        const componentes = [...document.querySelectorAll(".fila-componente")].map((fila) => ({
          subproducto_id: parseInt(fila.querySelector("[data-comp-subproducto]").value, 10),
          cantidad: parseInt(fila.querySelector("[data-comp-cantidad]").value || "1", 10),
        }));
        const textoPrecio = document.getElementById("pq-precio").value.trim();
        const iva = parseInt(document.getElementById("pq-iva").value, 10);
        await api("/paquetes", { method: "POST", body: JSON.stringify({ nombre, codigo, componentes,
          precio_centimos: textoPrecio === "" ? null : centimosDeTexto(textoPrecio), iva_porcentaje: Number.isFinite(iva) ? iva : 21 }) });
        renderPaquetes();
      } catch (e) { document.getElementById("pq-error").textContent = e.message; }
    };
    cont.querySelectorAll("[data-guardar]").forEach((btn) => {
      btn.onclick = async () => {
        const fila = cont.querySelector(`tr[data-fila-paquete="${btn.dataset.guardar}"]`);
        const nombre = fila.querySelector('[data-campo="nombre"]').value;
        const codigo = fila.querySelector('[data-campo="codigo"]').value.toUpperCase();
        const activo = fila.querySelector('[data-campo="activo"]').checked;
        const textoPrecio = fila.querySelector('[data-campo="precio"]').value.trim();
        const iva = parseInt(fila.querySelector('[data-campo="iva"]').value, 10);
        try {
          await api(`/paquetes/${btn.dataset.guardar}`, { method: "PATCH", body: JSON.stringify({ nombre, codigo, activo,
            precio_centimos: textoPrecio === "" ? null : centimosDeTexto(textoPrecio), iva_porcentaje: Number.isFinite(iva) ? iva : 21 }) });
          renderPaquetes();
        } catch (e) { avisar(e.message); }
      };
    });
  }

  // -------------------------------------------------------------- catalogo

  async function renderCatalogo() {
    const cont = document.getElementById("contenido");
    let clientes = [];
    if (estado.yo.rol === ROLES.ADMIN_SISTEMA) {
      clientes = await api("/clientes");
    } else {
      clientes = [await obtenerMiCliente()];
    }
    cont.innerHTML = `
      <h2>${t("tab_catalogo", "Catálogo")}</h2>
      <p class="ayuda">${t("ayuda_catalogo", 'Aquí se decide qué productos puede pedir cada cliente. Si un producto no está marcado aquí para un cliente en concreto, esa empresa ni lo verá en el desplegable de "Nuevo pedido" — así cada cliente solo ve lo suyo.')}</p>
      ${estado.yo.rol === ROLES.ADMIN_SISTEMA ? `<select id="cat-cliente"><option value="">${t("elige_un_cliente", "Elige un cliente...")}</option>${clientes.map((c) =>
        `<option value="${c.id}">${escapeHtml(etiquetaCliente(c))}</option>`).join("")}</select>` : ""}
      <div id="cat-detalle"></div>`;
    if (estado.yo.rol === ROLES.ADMIN_SISTEMA) {
      document.getElementById("cat-cliente").onchange = (e) => pintarDetalleCatalogo(Number(e.target.value) || null);
    } else {
      pintarDetalleCatalogo(clientes[0].id);
    }
  }

  async function obtenerMiCliente() {
    const clientes = await api("/clientes");
    return clientes[0];
  }

  async function pintarDetalleCatalogo(clienteId) {
    const det = document.getElementById("cat-detalle");
    if (!clienteId) { det.innerHTML = ""; return; }
    const [cliente, todosProductos, asignados] = await Promise.all([
      api("/clientes").then((cs) => cs.find((c) => c.id === clienteId)),
      api("/productos"),
      api(`/clientes/${clienteId}/productos`),
    ]);
    const idsAsignados = new Set(asignados.map((p) => p.id));
    det.innerHTML = `
      ${estado.yo.rol === ROLES.ADMIN_CLIENTE ? `
        <form class="alta" id="form-empresa">
          <label>${t("razon_social", "Razón social")} <input id="emp-razon" value="${escapeHtml(cliente.razon_social)}" /></label>
          <label>${t("cif", "CIF")} <input id="emp-cif" value="${escapeHtml(cliente.cif || "")}" /></label>
          <button type="submit">${t("guardar", "Guardar")}</button>
        </form>` : ""}
      <h3>${t("productos_activos", "Productos activos")}</h3>
      <div>${(await api("/productos")).filter((p) => p.activo).map((p) => `
        <label style="margin-right:14px">
          <input type="checkbox" data-cat-producto="${p.id}" ${idsAsignados.has(p.id) ? "checked" : ""} />
          ${p.led_codigo ? `<span class="bolita" style="background:${(estado.paleta[p.led_codigo] || {}).rgb || "#888"}"></span>` : ""}
          ${escapeHtml(p.nombre)} (${escapeHtml(p.codigo)})
        </label>`).join("")}</div>`;
    const formEmpresa = document.getElementById("form-empresa");
    if (formEmpresa) {
      formEmpresa.onsubmit = async (ev) => {
        ev.preventDefault();
        await api(`/clientes/${clienteId}`, { method: "PATCH", body: JSON.stringify({
          razon_social: document.getElementById("emp-razon").value,
          cif: document.getElementById("emp-cif").value,
        }) });
      };
    }
    det.querySelectorAll("[data-cat-producto]").forEach((chk) => {
      chk.onchange = async () => {
        const productoId = chk.dataset.catProducto;
        if (chk.checked) {
          await api(`/clientes/${clienteId}/productos`, { method: "POST", body: JSON.stringify({ producto_id: Number(productoId) }) });
        } else {
          await api(`/clientes/${clienteId}/productos/${productoId}`, { method: "DELETE" });
        }
      };
    });
  }

  // -------------------------------------------------------------- usuarios

  async function renderUsuarios() {
    const [usuarios, clientes] = await Promise.all([
      api("/usuarios"),
      estado.yo.rol === ROLES.ADMIN_SISTEMA ? api("/clientes") : Promise.resolve([]),
    ]);
    const clientesPorId = {};
    clientes.forEach((c) => { clientesPorId[c.id] = c; });
    const cont = document.getElementById("contenido");
    cont.innerHTML = `
      <h2>${t("tab_usuarios", "Usuarios")}</h2>
      <p class="ayuda">${t("ayuda_usuarios", 'Las personas que pueden entrar a este sistema. Un usuario "<b>Normal</b>" solo puede hacer pedidos y consultarlos; un "<b>Admin. cliente</b>" además gestiona el catálogo y los usuarios de su propia empresa; "<b>Admin. sistema</b>" lo ve y toca absolutamente todo, de todos los clientes; un "<b>Empleado de la empresa</b>" es alguien de nuestro taller que solo ve lo que le marques: <b>Producción</b>, <b>Contabilidad</b> o las dos (nunca Administración). Si dejas el usuario <b>vacío</b>, se forma solo con el código del cliente y la sucursal (<b>mur-bilbao</b>, o <b>mur-admin</b> para un administrador de empresa).')}</p>
      <form class="alta" id="form-nuevo-usuario">
        <input id="us-username" placeholder="${t("usuario_vacio_automatico", "usuario (vacío = automático)")}" style="width:14em" title="${t("titulo_usuario_automatico", "Si lo dejas vacío se forma con el código del cliente y la sucursal: mur-bilbao (o mur-admin para un administrador de empresa).")}" />
        <input id="us-nombre" placeholder="${t("nombre_completo_min", "nombre completo")}" required />
        <select id="us-rol">
          <option value="normal">${nombreRol("normal")}</option>
          <option value="admin_cliente">${nombreRol("admin_cliente")}</option>
          ${estado.yo.rol === ROLES.ADMIN_SISTEMA ? `<option value="empleado">${nombreRol("empleado")}</option>` : ""}
        </select>
        <span id="us-permisos" class="oculto">
          <label><input type="checkbox" id="us-p-produccion" /> ${t("grupo_produccion", "Producción")}</label>
          <label><input type="checkbox" id="us-p-contabilidad" /> ${t("grupo_contabilidad", "Contabilidad")}</label>
        </span>
        ${estado.yo.rol === ROLES.ADMIN_SISTEMA ? `<select id="us-cliente">
          <option value="">${t("elige_cliente_paren", "(elige cliente)")}</option>
          ${clientes.map((c) => `<option value="${c.id}">${escapeHtml(etiquetaCliente(c))}</option>`).join("")}
        </select>` : ""}
        <input id="us-sucursal" placeholder="${t("sucursal_opcional", "sucursal (opcional)")}" />
        <input id="us-password" type="password" placeholder="${t("contrasena_opcional", "contraseña (opcional)")}" />
        <button type="submit">${t("crear", "Crear")}</button>
        <span id="us-error" style="color:#c0392b"></span>
      </form>
      <table>
        <thead><tr><th>${t("th_id", "ID")}</th><th>${t("th_usuario", "Usuario")}</th><th>${t("th_nombre", "Nombre")}</th><th>${t("th_rol", "Rol")}</th>${estado.yo.rol === ROLES.ADMIN_SISTEMA ? `<th>${t("th_cliente", "Cliente")}</th>` : ""}${estado.yo.rol === ROLES.ADMIN_SISTEMA ? `<th>${t("th_permisos", "Permisos")}</th>` : ""}<th>${t("th_sucursal", "Sucursal")}</th><th>${t("th_activo", "Activo")}</th><th>${t("th_nueva_password", "Nueva contraseña")}</th><th></th></tr></thead>
        <tbody>${usuarios.map((u) => `
          <tr data-fila-usuario="${u.id}">
            <td>${u.id}</td>
            <td>${escapeHtml(u.username)}</td>
            <td><input data-campo="nombre_completo" value="${escapeHtml(u.nombre_completo)}" /></td>
            <td><select data-campo="rol">
              ${u.cliente_id ? `
              <option value="normal" ${u.rol === "normal" ? "selected" : ""}>${nombreRol("normal")}</option>
              <option value="admin_cliente" ${u.rol === "admin_cliente" ? "selected" : ""}>${nombreRol("admin_cliente")}</option>` : `
              <option value="empleado" ${u.rol === "empleado" ? "selected" : ""}>${nombreRol("empleado")}</option>`}
              ${estado.yo.rol === ROLES.ADMIN_SISTEMA ? `<option value="admin_sistema" ${u.rol === "admin_sistema" ? "selected" : ""}>${nombreRol("admin_sistema")}</option>` : ""}
            </select></td>
            ${estado.yo.rol === ROLES.ADMIN_SISTEMA ? `<td>${escapeHtml(u.cliente_id ? etiquetaCliente(clientesPorId[u.cliente_id]) || ("#" + u.cliente_id) : t("nuestra_empresa", "(nuestra empresa)"))}</td>
            <td>${u.rol === "empleado" ? `
              <label><input type="checkbox" data-campo="permiso_produccion" ${u.permiso_produccion ? "checked" : ""} /> ${t("grupo_produccion", "Producción")}</label>
              <label><input type="checkbox" data-campo="permiso_contabilidad" ${u.permiso_contabilidad ? "checked" : ""} /> ${t("grupo_contabilidad", "Contabilidad")}</label>`
              : (u.rol === "admin_sistema" ? t("permisos_todo", "todo") : "—")}</td>` : ""}
            <td><input data-campo="sucursal" value="${escapeHtml(u.sucursal || "")}" /></td>

          </tr>`).join("")}</tbody>
      </table>`;

    // Empleado de la empresa: sin cliente ni sucursal, con casillas de permisos.
    const selRol = document.getElementById("us-rol");
    selRol.onchange = () => {
      const esEmpleado = selRol.value === "empleado";
      document.getElementById("us-permisos").classList.toggle("oculto", !esEmpleado);
      ["us-cliente", "us-sucursal"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle("oculto", esEmpleado);
      });
      document.getElementById("us-username").placeholder = esEmpleado
        ? t("usuario_empleado", "usuario (p. ej. antonio)") : t("usuario_vacio_automatico", "usuario (vacío = automático)");
      document.getElementById("us-password").placeholder = esEmpleado
        ? t("contrasena_obligatoria", "contraseña (obligatoria)") : t("contrasena_opcional", "contraseña (opcional)");
    };
    document.getElementById("form-nuevo-usuario").onsubmit = async (ev) => {
      ev.preventDefault();
      try {
        const esEmpleado = document.getElementById("us-rol").value === "empleado";
        await api("/usuarios", { method: "POST", body: JSON.stringify({
          username: document.getElementById("us-username").value || null,
          nombre_completo: document.getElementById("us-nombre").value,
          rol: document.getElementById("us-rol").value,
          cliente_id: estado.yo.rol === ROLES.ADMIN_SISTEMA
            ? (Number(document.getElementById("us-cliente").value) || null) : undefined,
          sucursal: document.getElementById("us-sucursal").value || null,
          password: document.getElementById("us-password").value || null,
          permiso_produccion: esEmpleado && document.getElementById("us-p-produccion").checked,
          permiso_contabilidad: esEmpleado && document.getElementById("us-p-contabilidad").checked,
        }) });
        renderUsuarios();
      } catch (e) { document.getElementById("us-error").textContent = e.message; }
    };
    cont.querySelectorAll("[data-guardar-usuario]").forEach((btn) => {
      btn.onclick = async () => {
        const fila = cont.querySelector(`tr[data-fila-usuario="${btn.dataset.guardarUsuario}"]`);
        const payload = {
          nombre_completo: fila.querySelector('[data-campo="nombre_completo"]').value,
          rol: fila.querySelector('[data-campo="rol"]').value,
          sucursal: fila.querySelector('[data-campo="sucursal"]').value || null,
          activo: fila.querySelector('[data-campo="activo"]').checked,
        };
        ["permiso_produccion", "permiso_contabilidad"].forEach((campo) => {
          const chk = fila.querySelector(`[data-campo="${campo}"]`);
          if (chk) payload[campo] = chk.checked;
        });
        const password = fila.querySelector('[data-campo="password"]').value;
        if (password) payload.password = password;
        try {
          await api(`/usuarios/${btn.dataset.guardarUsuario}`, { method: "PATCH", body: JSON.stringify(payload) });
          renderUsuarios();
        } catch (e) { avisar(e.message); }
      };
    });
  }

  // -------------------------------------------------------------- clientes

  async function renderClientes() {
    const clientes = await api("/clientes");
    const cont = document.getElementById("contenido");
    cont.innerHTML = `
      <h2>${t("tab_clientes", "Clientes")}</h2>
      <p class="ayuda">${t("ayuda_clientes", "Las empresas que usan este sistema para pedir producción. Cada cliente es un mundo aparte — sus propios usuarios, su propio catálogo de productos permitidos (pestaña Catálogo) y sus propios pedidos, sin mezclarse con los de otro cliente. Al crear uno nuevo aquí se crea a la vez su primer usuario administrador. Los datos fiscales (dirección, email de facturación) son opcionales ahora, pero harán falta en cuanto se emitan facturas. El <b>código</b> del cliente (3 letras, por ejemplo <b>MUR</b>) es el que da nombre a sus usuarios: <b>mur-admin</b> para el administrador y <b>mur-bilbao</b> para la sucursal de Bilbao, así dos clientes pueden tener cada uno su sucursal de Bilbao sin chocar.")}</p>
      <form class="alta" id="form-nuevo-cliente">
        <input id="cl-razon" placeholder="${t("razon_social", "Razón social")}" required />
        <input id="cl-codigo" placeholder="${t("codigo_3", "Código (3)")}" maxlength="3" style="width:5.5em;text-transform:uppercase" title="${t("titulo_codigo_cliente", "3 letras o cifras (por ejemplo MUR). Si lo dejas vacío se saca de la razón social. De él salen los usuarios: mur-admin, mur-bilbao…")}" />
        <input id="cl-cif" placeholder="${t("cif_opcional", "CIF (opcional)")}" />
        <input id="cl-direccion" placeholder="${t("direccion_opcional", "Dirección (opcional)")}" />
        <input id="cl-cp" placeholder="${t("cp_abrev", "C.P.")}" style="width:5em" />
        <input id="cl-poblacion" placeholder="${t("poblacion", "Población")}" />
        <input id="cl-provincia" placeholder="${t("provincia", "Provincia")}" />
        <input id="cl-email" type="email" placeholder="${t("email_facturacion", "Email facturación")}" />
        <input id="cl-username" placeholder="${t("usuario_primer_admin", "Usuario del primer admin (vacío = código-admin)")}" style="width:18em" />
        <input id="cl-nombre" placeholder="${t("nombre_primer_admin", "Nombre del primer admin")}" required />
        <input id="cl-password" type="password" placeholder="${t("contrasena_opcional_cap", "Contraseña (opcional)")}" />
        <button type="submit">${t("crear", "Crear")}</button>
        <span id="cl-error" style="color:#c0392b"></span>
      </form>
      <table>
        <thead><tr><th>${t("th_id", "ID")}</th><th>${t("th_codigo", "Código")}</th><th>${t("razon_social", "Razón social")}</th><th>${t("cif", "CIF")}</th><th>${t("th_direccion", "Dirección")}</th><th>${t("cp_abrev", "C.P.")}</th><th>${t("poblacion", "Población")}</th><th>${t("provincia", "Provincia")}</th><th>${t("email_facturacion", "Email facturación")}</th><th>${t("th_activo", "Activo")}</th><th></th></tr></thead>
        <tbody>${clientes.map((c) => `
          <tr data-fila-cliente="${c.id}">
            <td>${c.id}</td>
            <td><input data-campo="codigo" value="${escapeHtml(c.codigo || "")}" maxlength="3" style="width:4em;text-transform:uppercase" /></td>
            <td><input data-campo="razon_social" value="${escapeHtml(c.razon_social)}" /></td>
            <td><input data-campo="cif" value="${escapeHtml(c.cif || "")}" /></td>
            <td><input data-campo="direccion" value="${escapeHtml(c.direccion || "")}" /></td>
            <td><input data-campo="codigo_postal" value="${escapeHtml(c.codigo_postal || "")}" style="width:5em" /></td>
            <td><input data-campo="poblacion" value="${escapeHtml(c.poblacion || "")}" /></td>
            <td><input data-campo="provincia" value="${escapeHtml(c.provincia || "")}" /></td>
            <td><input data-campo="email_facturacion" value="${escapeHtml(c.email_facturacion || "")}" /></td>
            <td><input type="checkbox" data-campo="activo" ${c.activo ? "checked" : ""} /></td>

    document.getElementById("form-nuevo-cliente").onsubmit = async (ev) => {

          codigo: document.getElementById("cl-codigo").value || null,
          cif: document.getElementById("cl-cif").value || null,
          direccion: document.getElementById("cl-direccion").value || null,
          codigo_postal: document.getElementById("cl-cp").value || null,

  // --------------------------------------------------------------- almacen

  async function renderAlmacen() {
    const [config, stock, movimientos, productos, pedidos] = await Promise.all([
      api("/almacen/configuracion"), api("/stock"), api("/movimientos_stock"), api("/productos"),
      api("/pedidos"),
    ]);
    const productosPorId = {};
    productos.forEach((p) => { productosPorId[p.id] = p; });
    // Desglose por subproducto (sesion 2026-09-15, a peticion del usuario:
    // "almacen tambien tiene que estar desglosado en subproductos") -- el
    // stock fisico sigue siendo por producto (no se puede distinguir un
    // Clavo de 10 de uno de 20 una vez en el almacen), pero se puede
    // mostrar cuanto de ese stock hace falta para cada variante pendiente,
    // igual que en el resumen del panel de control.
    const ACTIVOS = ["pendiente", "en_proceso"];
    const pendientePorProducto = {};
    pedidos.filter((p) => ACTIVOS.includes(p.estado)).forEach((p) => {
      const restante = p.cantidad_pedida - p.cantidad_completada;
      if (restante <= 0) return;
      const porSub = pendientePorProducto[p.producto_id] || (pendientePorProducto[p.producto_id] = {});
      porSub[p.subproducto.nombre] = (porSub[p.subproducto.nombre] || 0) + restante;
    });
    // Orden logico: por codigo de producto, no por orden de alta en la BBDD.
    const stockOrdenado = [...stock].sort((a, b) => a.producto.codigo.localeCompare(b.producto.codigo));
    const cont = document.getElementById("contenido");
    cont.innerHTML = `
      <h2>${t("tab_almacen", "Almacén")}</h2>
      <p class="ayuda">${t("ayuda_almacen", "El stock de piezas ya fabricadas y guardadas, listas para servir sin esperar a que la celda las haga de nuevo. Aquí se ve y se ajusta a mano lo que hay guardado. Repartir ese stock entre los pedidos (asignarlo y entregarlo, con su albarán) se hace en la pestaña <b>Reparto</b>, donde están también los interruptores automáticos. Los \"Movimientos\" de más abajo son el histórico de cada entrada y salida, por si algún día hay que rastrear de dónde salió o a dónde fue una pieza.")}</p>
      <h3>${t("stock", "Stock")}</h3>
      <table>
        <thead><tr><th>${t("th_producto", "Producto")}</th><th>${t("th_codigo", "Código")}</th><th>${t("th_cantidad", "Cantidad")}</th><th>${t("th_actualizado", "Actualizado")}</th><th></th></tr></thead>
        <tbody>${stockOrdenado.map((s) => {
          const porSub = pendientePorProducto[s.producto_id] || {};
          // Una fila propia por variante pendiente (sesion 2026-09-15, a
          // peticion del usuario: "en almacen me gustaria ver como en
          // panel de control en resumen por producto, en varias lineas")
          // -- mismo estilo que el resumen de teleop_gui.py, no todo en
          // una linea con comas.
          const filasSub = Object.entries(porSub).sort(([a], [b]) => a.localeCompare(b))
            .map(([nombre, cantidad]) => `
              <tr>
                <td colspan="5" style="color:#9a8f7d;padding-left:2em">· ${t("pendientes_n", "{nombre}: {n} pendiente(s)", { nombre: escapeHtml(nombre), n: cantidad })}</td>
              </tr>`).join("");
          return `
          <tr>
            <td>${escapeHtml(s.producto.nombre)}</td>
            <td>${escapeHtml(s.producto.codigo)}</td>
            <td>${s.cantidad_actual}</td>
            <td>${fechaLocal(s.actualizado_en)}</td>
            <td>
              <input type="number" min="1" value="1" style="width:60px" data-cant="${s.producto_id}" />
              <button data-anadir="${s.producto_id}">${t("anadir_a_stock", "Añadir a stock")}</button>
              <button data-quitar="${s.producto_id}">${t("quitar_de_stock", "Quitar de stock")}</button>
            </td>
          </tr>${filasSub}`;
        }).join("")}</tbody>
      </table>
      <h3>${t("movimientos", "Movimientos")}</h3>
      <table>
        <thead><tr><th>${t("th_fecha", "Fecha")}</th><th>${t("th_producto", "Producto")}</th><th>${t("th_tipo", "Tipo")}</th><th>${t("th_cantidad", "Cantidad")}</th><th>${t("th_motivo", "Motivo")}</th><th>${t("th_pedido", "Pedido")}</th></tr></thead>
        <tbody>${movimientos.map((m) => `
          <tr>
            <td>${fechaLocal(m.fecha)}</td>
            <td>${escapeHtml((productosPorId[m.producto_id] || {}).nombre || m.producto_id)}</td>
            <td>${escapeHtml(m.tipo)}</td>
            <td>${m.cantidad}</td>
            <td>${escapeHtml(m.motivo)}</td>
            <td>${m.pedido_id || "—"}</td>
          </tr>`).join("")}</tbody>
      </table>`;

    cont.querySelectorAll("[data-anadir]").forEach((btn) => {
      btn.onclick = async () => {
        const cantidad = Number(cont.querySelector(`[data-cant="${btn.dataset.anadir}"]`).value);
        try {
          await api("/almacen/ajustar", { method: "POST", body: JSON.stringify({ producto_id: Number(btn.dataset.anadir), cantidad }) });
          renderAlmacen();
        } catch (e) { avisar(e.message); }
      };
    });
    cont.querySelectorAll("[data-quitar]").forEach((btn) => {
      btn.onclick = async () => {
        const cantidad = Number(cont.querySelector(`[data-cant="${btn.dataset.quitar}"]`).value);
        try {
          await api("/almacen/quitar", { method: "POST", body: JSON.stringify({ producto_id: Number(btn.dataset.quitar), cantidad }) });
          renderAlmacen();
        } catch (e) { avisar(e.message); }
      };
    });
  }

  // ----------------------------------------------------------- diagnostico

  async function renderDiagnostico() {
    const cont = document.getElementById("contenido");
    cont.innerHTML = `
      <h2>${t("tab_diagnostico", "Diagnóstico")}</h2>
      <p class="ayuda">${t("ayuda_diagnostico", "Un vistazo a cómo está yendo la producción de verdad: cuántas piezas ha hecho cada producto, cuántas veces ha fallado el agarre, y si algo se ha quedado atascado sin arreglarse solo. Es información técnica para depurar la celda robótica — no hace falta mirarla para el día a día de pedir y servir producción.")}</p>
      <select id="diag-ventana">
        <option value="15">${t("15_minutos", "15 minutos")}</option>
        <option value="60" selected>${t("1_hora", "1 hora")}</option>
        <option value="360">${t("6_horas", "6 horas")}</option>
        <option value="1440">${t("1_dia", "1 día")}</option>
      </select>
      <div id="diag-cuerpo"></div>`;
    document.getElementById("diag-ventana").onchange = (e) => pintarDiagnostico(Number(e.target.value));
    pintarDiagnostico(60);
  }

  async function pintarDiagnostico(minutos) {
    const diag = await api(`/taller/diagnostico?ventana_minutos=${minutos}`);
    const maximo = Math.max(1, ...diag.por_color.map((c) =>
      Math.max(c.piezas_reales, c.led_loader, c.led_sorter, c.agarre_falso, c.limite_alcance, c.fallo_definitivo)));
    function barra(etiqueta, valor, color) {
      return `<div class="barra-diag"><span class="etiqueta">${escapeHtml(etiqueta)}</span>
        <div class="fondo"><div class="relleno" style="width:${(valor / maximo) * 100}%;background:${color}"></div></div>
        <span>${valor}</span></div>`;
    }
    const cuerpo = document.getElementById("diag-cuerpo");
    cuerpo.innerHTML = `
      ${diag.por_color.map((c) => `
        <div style="border:1px solid #444;border-radius:6px;padding:10px;margin:10px 0">
          <h3>${escapeHtml(c.producto_nombre)} ${c.color ? `(${escapeHtml(c.color)})` : `(${t("sin_led_op", "Sin LED")})`}
            <span class="pill" style="border-color:${COLOR_ESTADO[c.estado] || "#444"};color:${COLOR_ESTADO[c.estado] || "#eaeaea"}">${escapeHtml(c.estado)}</span>
          </h3>
          ${barra(t("piezas_reales", "Piezas reales"), c.piezas_reales, "#2e9e3b")}
          ${barra(t("led_loader", "LED Loader"), c.led_loader, "#1f5a8a")}
          ${barra(t("led_sorter", "LED Sorter"), c.led_sorter, "#6a3ea1")}
          ${barra(t("agarre_falso", "Agarre falso"), c.agarre_falso, "#c0392b")}
          ${barra(t("limite_de_alcance", "Límite de alcance"), c.limite_alcance, "#e07b39")}
          ${barra(t("fallo_definitivo", "Fallo definitivo"), c.fallo_definitivo, "#ff4d4d")}
          <div style="font-size:12px;color:#999">${t("piezas_totales_historicas", "Piezas totales históricas")}: ${c.piezas_reales_total}</div>
        </div>`).join("")}
      <h3>${t("ultimos_eventos", "Últimos eventos")}</h3>
      <table><thead><tr><th>${t("th_fecha", "Fecha")}</th><th>${t("th_robot", "Robot")}</th><th>${t("th_color", "Color")}</th><th>${t("th_tipo", "Tipo")}</th></tr></thead>
        <tbody>${diag.eventos_recientes.map((e) => `
          <tr><td>${fechaLocal(e.fecha)}</td><td>${escapeHtml(e.robot)}</td><td>${escapeHtml(e.color)}</td><td>${escapeHtml(e.tipo)}</td></tr>`).join("")}</tbody>
      </table>`;
  }

  async function renderAuditoria() {
    const filas = await api("/audit");
    const cont = document.getElementById("contenido");
    cont.innerHTML = `
      <h2>${t("tab_auditoria", "Auditoría")}</h2>

      <table>
        <thead><tr><th>${t("th_fecha", "Fecha")}</th><th>${t("th_tabla", "Tabla")}</th><th>${t("th_registro", "Registro")}</th><th>${t("th_accion", "Acción")}</th><th>${t("th_usuario", "Usuario")}</th><th>${t("th_detalle", "Detalle")}</th></tr></thead>
        <tbody>${filas.map((f) => `
          <tr>

          </tr>`).join("")}</tbody>
      </table>`;
  }

  document.getElementById("btn-login").onclick = iniciarSesion;
  document.getElementById("login-password").addEventListener("keydown", (e) => { if (e.key === "Enter") iniciarSesion(); });
  document.getElementById("btn-salir").onclick = cerrarSesion;

  (async function mostrarVersion() {
    try {
      const { version } = await api("/version");
      document.getElementById("vr-version").textContent = `Ver. ${version}`;
    } catch (e) { /* sin version disponible: se deja el hueco vacio */ }
  })();

  // Selector de idioma: ES/EN/EU de verdad (sesion 2026-09-22), ver aplicarIdioma()
  // e inicializarSelectorIdioma() mas arriba y el diccionario en i18n_panel.js.
  inicializarSelectorIdioma();

  (async function inicio() {
    if (restaurarSesion()) {
      try {
        estado.yo = await api("/me");
        await cargarPaleta();
        mostrarApp();
        return;
      } catch (e) { /* sesion muerta: api() ya nos ha devuelto al login */ }
    }
    mostrarLogin();
  })();
})();
