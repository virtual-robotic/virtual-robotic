<!-- Dialogo propio: NO usar confirm()/alert() del navegador. Firefox (y

<script src="/static/i18n_panel.js"></script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------ idioma (i18n)
  // Sesion 2026-09-22: el selector ES/EN/EU de arriba ya traduce de verdad.
  // t(clave, es[, vars]) devuelve la traduccion de i18n_panel.js si el idioma
  // no es "es" y existe la clave; si no, el propio texto castellano 'es' (que
  // hace de valor por defecto Y de documentacion de que dice ese texto).
  // 'vars' sustituye {nombre} dentro del texto ya traducido (para plurales,
  // numeros, etc. sin tener que traducir un texto por cada valor posible).
  function t(clave, es, vars) {
    const dic = (window.VR_I18N_PANEL && window.VR_I18N_PANEL[estado.idioma]) || {};
    let s = dic[clave] !== undefined ? dic[clave] : es;
    if (vars) Object.keys(vars).forEach((k) => { s = s.replaceAll("{" + k + "}", vars[k]); });
    return s;
  }

  // Repinta lo que hay en pantalla en el idioma nuevo, sin perder filtros ni
  // sesion: la cabecera, el menu de dos niveles y la pestana activa (si el
  // panel ya esta dentro, no en el login).
  function aplicarIdioma(lang) {
    estado.idioma = { es: 1, en: 1, eu: 1 }[lang] ? lang : "es";
    document.documentElement.lang = estado.idioma;
    document.getElementById("vr-caption").textContent = t("caption_sistema", "· Sistema de pedidos y almacén");
    document.getElementById("login-titulo").textContent = t("login_titulo", "Taller - Administracion");
    document.getElementById("login-lbl-usuario").textContent = t("login_usuario", "Usuario");
    document.getElementById("login-lbl-password").textContent = t("login_password", "Contraseña");
    document.getElementById("btn-login").textContent = t("entrar", "Entrar");
    document.getElementById("btn-salir").textContent = t("salir", "Salir");
    document.getElementById("dlg-cancelar").textContent = t("cancelar", "Cancelar");
    document.getElementById("dlg-ok").textContent = t("aceptar", "Aceptar");
    if (!document.getElementById("app-principal").classList.contains("oculto")) {
      pintarCabecera();
      pintarTabs();
      if (estado.pestanaActiva) irATab(estado.pestanaActiva);
    }
  }

  function inicializarSelectorIdioma() {
    const sel = document.getElementById("vr-idioma");
    let lang = "es";
    try { lang = localStorage.getItem("vr_idioma") || "es"; } catch (e) { /* sin almacenamiento: se queda en es */ }
    sel.value = { es: 1, en: 1, eu: 1 }[lang] ? lang : "es";
    aplicarIdioma(sel.value);
    sel.onchange = () => {
      try { localStorage.setItem("vr_idioma", sel.value); } catch (e) { /* no pasa nada, solo no se recuerda */ }
      aplicarIdioma(sel.value);
    };
  }

  // Sustitutos de confirm()/alert(): ver el comentario del diálogo en el HTML.
  function dialogo(texto, conCancelar) {
    return new Promise((resolve) => {
      const fondo = document.getElementById("dlg-fondo");
      const btnOk = document.getElementById("dlg-ok");
      const btnCancelar = document.getElementById("dlg-cancelar");
      document.getElementById("dlg-texto").textContent = texto;
      btnCancelar.classList.toggle("oculto", !conCancelar);
      fondo.classList.remove("oculto");
      btnOk.focus();
      function cerrar(valor) {
        fondo.classList.add("oculto");
        btnOk.onclick = null;
        btnCancelar.onclick = null;
        document.removeEventListener("keydown", teclado);
        resolve(valor);
      }
      function teclado(e) {
        if (e.key === "Escape") cerrar(!conCancelar);
        if (e.key === "Enter") cerrar(true);
      }
      btnOk.onclick = () => cerrar(true);
      btnCancelar.onclick = () => cerrar(false);
      document.addEventListener("keydown", teclado);
    });
  }
  const confirmar = (texto) => dialogo(texto, true);
  const avisar = (texto) => dialogo(texto, false);

  function duracion(segundos) {
    if (segundos === null || segundos === undefined) return "—";
    const s = Math.round(segundos);
    if (s < 60) return `${s} s`;
    const m = Math.floor(s / 60);
    if (m < 60) return s % 60 ? `${m} min ${s % 60} s` : `${m} min`;
    const h = Math.floor(m / 60);
    return m % 60 ? `${h} h ${m % 60} min` : `${h} h`;
  }

  // segundos_proceso === 0 no significa "se fabricó al instante": significa
  // que salió TODO de golpe de una entrega ya en Stock (una sola fila de
  // movimiento con toda la cantidad, ver _con_tiempos_de_proceso en
  // main.py) -- mostrar "0 s" ahí parece un cronómetro roto en vez de lo
  // que es de verdad (no hizo falta fabricar nada en ese momento).
  function celdaTiempoProceso(segundos) {
    if (segundos === null || segundos === undefined) return "—";
    if (segundos === 0) return t("de_stock", "de stock");
    return duracion(segundos);
  }
  function tituloTiempoProceso(segundos, segundosTotal) {
    if (segundos === null || segundos === undefined) return t("sin_piezas_aun", "Todavía no ha recibido ninguna pieza.");
    if (segundos === 0) return t("servido_de_golpe", "Servido de golpe desde lo que ya había en Stock -- no hizo falta fabricar nada en ese momento.");
    return t("primera_ultima_pieza", "De la primera a la última pieza: {a}. Desde que se hizo el pedido: {b}.", { a: duracion(segundos), b: duracion(segundosTotal) });
  }

  const ROLES = { ADMIN_SISTEMA: "admin_sistema", ADMIN_CLIENTE: "admin_cliente", NORMAL: "normal", EMPLEADO: "empleado" };
  const NOMBRES_ROL = { admin_sistema: "Admin. sistema", admin_cliente: "Admin. cliente", normal: "Normal", empleado: "Empleado de la empresa" };
  // Mismo criterio que auth.tiene_permiso del servidor (sesion 2026-09-26): el
  // admin_sistema puede todo; un empleado, solo los grupos que tenga marcados.
  function puede(grupo) {
    if (estado.yo.rol === ROLES.ADMIN_SISTEMA) return true;
    return estado.yo.rol === ROLES.EMPLEADO && !!estado.yo["permiso_" + grupo];
  }
  // Gente de nuestra empresa: ve los datos de todos los clientes (y no hace pedidos).
  function esInterno() { return puede("produccion") || puede("contabilidad"); }
  function nombreRol(rol) { return t("rol_" + rol, NOMBRES_ROL[rol] || rol); }
  // "completado" significa REPARTIDO (con albaran): se le llama asi al usuario
  // para que no se confunda con "fabricado" (lo que ahora es "listo").
  const ORIGEN_PRECIO = { tarifa_general: "tarifa general", tarifa_cliente: "tarifa especial de este cliente", manual: "corregido a mano" };
  function origenPrecio(o) { return t("origen_" + o, ORIGEN_PRECIO[o] || o); }
  const ETIQUETA_ESTADO = { pendiente: "pendiente", en_proceso: "en proceso", listo: "listo para reparto",
    completado: "repartido", cancelado: "cancelado" };
  function etiquetaEstado(e) { return t("estado_" + e, ETIQUETA_ESTADO[e] || e); }
  // Los importes viajan en centimos (enteros); solo aqui se pasan a euros para mostrarlos.
  function euros(centimos) {
    return (centimos / 100).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function centimosDeTexto(texto) {
    const n = parseFloat(String(texto).replace(",", "."));
    return Number.isFinite(n) ? Math.round(n * 100) : 0;
  }
  const COLOR_ESTADO = { pendiente: "#aaa", en_proceso: "#f5c400", completado: "#2e9e3b", cancelado: "#c0392b" };

  let estado = {
    token: null,
    yo: null,
    paleta: {},
    pestanaActiva: null,
    ultimaPorGrupo: {},
    filtrosPedidos: { cliente: "", producto: "", enAlmacen: "todos", estado: "" },
    refrescoPedidos: null,
    idioma: "es",
    factorPiezas: 1,
  };

  // ---------------------------------------------------------------- utiles

  // "MUR · Astilleros Murueta S.L.": el codigo del cliente por delante, cuando lo tiene.
  function etiquetaCliente(c) {
    return c ? (c.codigo ? c.codigo + " · " : "") + (c.razon_social || "") : "";
  }

  function escapeHtml(valor) {
    if (valor === null || valor === undefined) return "";
    return String(valor)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function guardarSesion() {
    try {
      sessionStorage.setItem("taller_token", estado.token || "");
      sessionStorage.setItem("taller_yo", JSON.stringify(estado.yo || null));
    } catch (e) { /* almacenamiento no disponible: la sesion no sobrevive a un recargar */ }
  }

  function borrarSesionGuardada() {
    try {
      sessionStorage.removeItem("taller_token");
      sessionStorage.removeItem("taller_yo");
    } catch (e) { /* nada que borrar */ }
  }

  function restaurarSesion() {
    try {
      const token = sessionStorage.getItem("taller_token");
      const yo = sessionStorage.getItem("taller_yo");
      if (token && yo) {
        estado.token = token;
        estado.yo = JSON.parse(yo);
        return true;
      }
    } catch (e) { /* sin sesion previa */ }
    return false;
  }

  // [MEJORA M18] cualquier 401 borra la sesion guardada y vuelve al login,
  // en vez de dejar el panel colgado con un token muerto tras un --reload.
  async function api(path, opciones) {
    opciones = opciones || {};
    const cabeceras = Object.assign({}, opciones.headers || {});
    if (estado.token) cabeceras["X-Session-Token"] = estado.token;
    if (opciones.body && !cabeceras["Content-Type"]) cabeceras["Content-Type"] = "application/json";
    const respuesta = await fetch(path, Object.assign({}, opciones, { headers: cabeceras }));
    if (respuesta.status === 401 && path !== "/login") {
      estado.token = null;
      estado.yo = null;
      borrarSesionGuardada();
      mostrarLogin("Sesion no valida -- inicia sesion de nuevo.");
      throw new Error("401");
    }
    let cuerpo = null;
    const texto = await respuesta.text();
    try { cuerpo = texto ? JSON.parse(texto) : null; } catch (e) { cuerpo = texto; }
    if (!respuesta.ok) {
      const mensaje = (cuerpo && typeof cuerpo === "object" && cuerpo.detail)
        ? cuerpo.detail
        : (typeof cuerpo === "string" ? cuerpo : `Error ${respuesta.status}`);
      throw new Error(mensaje);
    }
    return cuerpo;
  }

  function fechaLocal(iso) {
    if (!iso) return "";
    const conZona = iso.endsWith("Z") ? iso : iso + "Z";
    const d = new Date(conZona);
    if (isNaN(d.getTime())) return escapeHtml(iso);
    return d.toLocaleString();
  }

  // -------------------------------------------------------------- pantallas

  function mostrarLogin(mensajeError) {
    if (estado.refrescoPedidos) { clearInterval(estado.refrescoPedidos); estado.refrescoPedidos = null; }
    document.getElementById("app-principal").classList.add("oculto");
    document.getElementById("pantalla-login").classList.remove("oculto");
    document.getElementById("login-error").textContent = mensajeError || "";
  }

  function mostrarApp() {
    document.getElementById("pantalla-login").classList.add("oculto");
    document.getElementById("app-principal").classList.remove("oculto");
    // Factor de piezas (demo, ver Facturacion): sin bloquear el arranque si falla.
    api("/almacen/configuracion").then((c) => { estado.factorPiezas = c.factor_piezas || 1; }).catch(() => {});
    pintarCabecera();
    pintarTabs();
    // La pestana recordada solo vale si este rol la tiene (se puede haber cerrado
    // sesion y entrado con otro usuario); si no, la primera de la primera seccion.
    const disponibles = pestanasDisponibles();
    if (!disponibles.some((t) => t.id === estado.pestanaActiva)) {
      estado.pestanaActiva = null;
      estado.ultimaPorGrupo = {};
    }
    irATab(estado.pestanaActiva || disponibles[0].id);
  }

  async function iniciarSesion() {
    const username = document.getElementById("login-usuario").value;
    const password = document.getElementById("login-password").value;
    document.getElementById("login-error").textContent = "";
    try {
      const resultado = await api("/login", {
        method: "POST",
        body: JSON.stringify({ username, password }),
      });
      estado.token = resultado.token;
      estado.yo = resultado.usuario;
      guardarSesion();
      await cargarPaleta();
      mostrarApp();
    } catch (e) {
      document.getElementById("login-error").textContent = e.message;
    }
  }

  // Un empleado ve las pestanas de la gente de la empresa (las del admin) en los
  // grupos que tenga marcados; Administracion nunca.
  function pestanasDisponibles() {
    return TODAS_LAS_TABS.filter((t) => t.roles.includes(estado.yo.rol)
      || (estado.yo.rol === ROLES.EMPLEADO && t.grupo !== "administracion"
          && t.roles.includes(ROLES.ADMIN_SISTEMA) && puede(t.grupo)));
  }

  function gruposDisponibles() {
    const con = new Set(pestanasDisponibles().map((t) => t.grupo));
    return GRUPOS.filter((g) => con.has(g.id));
  }

  // Nivel 1: los grupos. Se oculta si el rol solo tiene uno (p.ej. un usuario
  // normal, que solo ve Pedidos): no tiene sentido un menu de una sola opcion.
  function pintarTabs() {
    const nav = document.getElementById("grupos");
    nav.innerHTML = "";
    const grupos = gruposDisponibles();
    nav.classList.toggle("oculto", grupos.length < 2);
    grupos.forEach((g) => {
      const btn = document.createElement("button");
      btn.textContent = t("grupo_" + g.id, g.nombre);
      btn.dataset.grupo = g.id;
      // Vuelve a la ultima pestana que se estaba mirando en ese grupo.
      btn.onclick = () => irATab(estado.ultimaPorGrupo[g.id] || pestanasDisponibles().find((t) => t.grupo === g.id).id);
      nav.appendChild(btn);
    });
  }

  // Nivel 2: las pestanas del grupo activo.
  function pintarSubtabs(grupoId) {
    const nav = document.getElementById("tabs");
    nav.innerHTML = "";
    pestanasDisponibles().filter((tb) => tb.grupo === grupoId).forEach((tb) => {
      const btn = document.createElement("button");
      btn.textContent = t("tab_" + tb.id, tb.nombre);
      btn.onclick = () => irATab(tb.id);
      btn.dataset.tab = tb.id;
      nav.appendChild(btn);
    });
  }

  function irATab(id) {
    const tab = TODAS_LAS_TABS.find((t) => t.id === id);
    estado.pestanaActiva = id;
    estado.ultimaPorGrupo[tab.grupo] = id;
    if (estado.refrescoPedidos) { clearInterval(estado.refrescoPedidos); estado.refrescoPedidos = null; }
    document.querySelectorAll("#grupos button").forEach((b) => {
      b.classList.toggle("activa", b.dataset.grupo === tab.grupo);
    });
    pintarSubtabs(tab.grupo);
    document.querySelectorAll("#tabs button").forEach((b) => {
      b.classList.toggle("activa", b.dataset.tab === id);
    });
    const render = { pedidos: renderPedidos, taller: renderPedidosTaller, reparto: renderReparto,
      albaranes: renderAlbaranes, facturas: renderFacturas, tarifas: renderTarifas,
      resumen_conta: renderResumenContable, empresa: renderEmpresa,
      facturacion: renderFacturacion, productos: renderProductos, subproductos: renderSubproductos,
      paquetes: renderPaquetes, colores: renderColores, catalogo: renderCatalogo,
      usuarios: renderUsuarios, clientes: renderClientes, almacen: renderAlmacen,
      diagnostico: renderDiagnostico, auditoria: renderAuditoria }[id];
    if (render) render();
  }

  async function renderPedidos() {
    const cont = document.getElementById("contenido");
    cont.innerHTML = `<h2>${t("tab_pedidos", "Pedidos")}</h2>
      <p class="ayuda">${t("ayuda_pedidos", 'Aquí se piden piezas: eliges un producto (una variante concreta) o un paquete entero, la cantidad, y lo metes en la <b>cesta</b> con <b>+ Añadir a la cesta</b>. Cuando la cesta está como quieres, pulsa <b>Pedir la cesta</b>: todo lo de una cesta se entrega <b>junto, en un solo albarán</b>. Un pedido de una sola cosa es simplemente una cesta de una línea; si quieres entregas separadas, haz una cesta para cada una. La cesta se guarda en este navegador hasta que la pidas. Cada pedido pasa por dos etapas: primero se consiguen las piezas (de <b>stock</b> o fabricándolas la celda) y quedan <b>listas</b>; luego se <b>reparten</b> al cliente y queda su albarán. Aquí ves en qué punto está cada uno: "<b>Completado</b>" son las piezas ya listas, "<b>Repartido</b>" las ya entregadas. "<b>Activos</b>" son los que aún no se han entregado del todo; "<b>Histórico</b>" los ya repartidos o cancelados.')}</p>
      <div id='pedidos-form'></div><div id='pedidos-tabla'></div>`;

    if (!esInterno()) {
      await pintarFormNuevoPedido();
    }
    await pintarTablaPedidos();
    estado.refrescoPedidos = setInterval(() => {
      if (estado.pestanaActiva === "pedidos") pintarTablaPedidos();
    }, 4000);
  }

  // Controles de una fila de pedido (urgente, maquina, cancelar) -- los comparten
  // la pestana Pedidos y la de Pedidos Taller; 'repintar' vuelve a dibujar la
  // que llama.
  function enlazarAccionesPedido(cont, repintar) {
    cont.querySelectorAll("[data-urgente]").forEach((chk) => {
      chk.onchange = async () => {
        await api(`/pedidos/${chk.dataset.urgente}`, { method: "PATCH", body: JSON.stringify({ urgente: chk.checked }) });
        repintar();
      };
    });
    cont.querySelectorAll("[data-maquina-asignar]").forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.maquinaAsignar;
        const input = cont.querySelector(`[data-maquina-input="${id}"]`);
        const numero = parseInt(input.value, 10);
        if (!Number.isInteger(numero) || numero < 1) {
          avisar(t("aviso_num_maquina", 'El número de máquina tiene que ser 1 o mayor (0 es "libre", se usa el botón Liberar para eso).'));
          return;
        }
        try {
          // forzar:true -- esto es administracion tocandolo a mano, no una
          // maquina reclamando sola, asi que salta la comprobacion de
          // "libre o mio" (ver POST /pedidos/{id}/reclamar en el backend).
          await api(`/pedidos/${id}/reclamar`, { method: "POST", body: JSON.stringify({ numero_maquina: numero, forzar: true }) });
          repintar();
        } catch (e) { avisar(e.message); }
      };
    });
    cont.querySelectorAll("[data-maquina-liberar]").forEach((btn) => {
      btn.onclick = async () => {
        try {
          await api(`/pedidos/${btn.dataset.maquinaLiberar}/liberar`, { method: "POST" });
          repintar();
        } catch (e) { avisar(e.message); }
      };
    });
    cont.querySelectorAll("[data-cancelar]").forEach((btn) => {
      btn.onclick = async () => {
        if (!await confirmar(t("confirmar_cancelar_pedido", "¿Cancelar este pedido?"))) return;
        try {
          await api(`/pedidos/${btn.dataset.cancelar}/cancelar`, { method: "POST" });
          repintar();
        } catch (e) { avisar(e.message); }
      };
    });
  }

  async function pintarFormNuevoPedido() {
    // Sesion 2026-09-15: se pide un SUBPRODUCTO (variante concreta), no ya
    // el producto directo -- ver Documentacion/aladin_cambio BBDD.txt. Los
    // subproductos disponibles son los de los productos asignados a este
    // cliente (misma asignacion de siempre, a nivel de producto).
    const [productosAsignados, todosLosSubproductos, paquetes] = await Promise.all([
      api(`/clientes/${estado.yo.cliente_id}/productos`), api("/subproductos"), api("/paquetes"),
    ]);
    const productosPorId = {};
    productosAsignados.filter((p) => p.activo).forEach((p) => { productosPorId[p.id] = p; });
    const subproductos = todosLosSubproductos.filter((s) => s.activo && productosPorId[s.producto_id]);
    const paquetesActivos = paquetes.filter((pq) => pq.activo);
    const cont = document.getElementById("pedidos-form");
    cont.innerHTML = `
      <form class="alta" id="form-nuevo-pedido">
        <b>${t("nuevo_pedido", "Nuevo pedido")}</b>
        <select id="np-articulo">
          <optgroup label="${t("productos_optgroup", "Productos")}">${subproductos.map((s) =>
            `<option value="p:${s.id}">${escapeHtml(productosPorId[s.producto_id].nombre)} · ${escapeHtml(s.nombre)} (${escapeHtml(s.codigo_completo)})</option>`).join("")}</optgroup>
          ${paquetesActivos.length ? `<optgroup label="${t("paquetes_optgroup", "Paquetes")}">${paquetesActivos.map((pq) =>
            `<option value="q:${pq.id}">${t("paquete_prefijo", "Paquete")}: ${escapeHtml(pq.nombre)} (${escapeHtml(pq.codigo)})${pq.precio_centimos !== null ? ` · ${euros(pq.precio_centimos)}` : ""} -- ${pq.componentes.map((c) => `${escapeHtml(c.subproducto.nombre)} x${c.cantidad}`).join(", ")}</option>`).join("")}</optgroup>` : ""}
        </select>
        <input id="np-cantidad" type="number" min="1" value="1" style="width:80px" />
        <button type="submit">${t("anadir_cesta", "+ Añadir a la cesta")}</button>
        <span id="np-error" style="color:#c0392b"></span>
      </form>
      <div id="np-cesta"></div>`;

    // ---- La cesta es la unica forma de pedir: una o varias cosas (productos y/o
    // paquetes) pedidas de una vez y entregadas juntas en UN albaran. Una cesta de
    // una sola linea es un pedido normal. Se guarda en el navegador para que una
    // recarga no la pierda.
    const claveCesta = `taller_cesta_${estado.yo.id}`;
    const existe = (it) => it.tipo === "paquete"
      ? paquetesActivos.some((pq) => pq.id === it.id)
      : subproductos.some((s) => s.id === it.id);
    function leerCesta() {
      try {
        const guardada = JSON.parse(localStorage.getItem(claveCesta) || "[]");
        return Array.isArray(guardada) ? guardada.filter((it) => it && existe(it) && it.cantidad >= 1) : [];
      } catch (e) { return []; }
    }
    function guardarCesta() {
      try { localStorage.setItem(claveCesta, JSON.stringify(estado.cesta)); } catch (e) { /* sin almacenamiento: la cesta vive solo en la pagina */ }
    }
    estado.cesta = leerCesta();
    function pintarCesta() {
      guardarCesta();
      const cont = document.getElementById("np-cesta");
      if (!estado.cesta.length) {
        cont.innerHTML = `<p style="color:#9a8f7d;font-size:13px;margin:4px 0 0">${t("cesta_vacia", "🛒 Elige un producto o un paquete y pulsa <b>+ Añadir a la cesta</b>. Todo lo de la cesta se entrega <b>junto, en un solo albarán</b>; un pedido de una sola cosa es una cesta de una línea.")}</p>`;
        return;
      }
      cont.innerHTML = `<div style="border:1px solid var(--borde);border-left:3px solid var(--titulo);border-radius:4px;padding:8px 12px;margin:10px 0;max-width:640px">
        <b>${t("cesta_titulo", "🛒 Cesta")}</b> <span style="color:#9a8f7d">${t("cesta_subtitulo", "— se entrega todo junto, en un solo albarán")}</span>
        <ul style="margin:8px 0 10px 18px;padding:0">${estado.cesta.map((it, i) =>
          `<li>${it.cantidad} × ${escapeHtml(it.texto)} <button type="button" data-cesta-quitar="${i}" title="${t("quitar_de_cesta", "Quitar de la cesta")}" style="padding:0 6px">✕</button></li>`).join("")}</ul>
        <button type="button" id="cesta-pedir">${estado.cesta.length === 1
          ? t("pedir_cesta_1", "Pedir la cesta (1 línea)")
          : t("pedir_cesta_n", "Pedir la cesta ({n} líneas)", { n: estado.cesta.length })}</button>
        <button type="button" id="cesta-vaciar">${t("vaciar", "Vaciar")}</button>
        <span id="cesta-error" style="color:#c0392b;margin-left:8px"></span></div>`;
      cont.querySelectorAll("[data-cesta-quitar]").forEach((b) => {
        b.onclick = () => { estado.cesta.splice(Number(b.dataset.cestaQuitar), 1); pintarCesta(); };
      });
      cont.querySelector("#cesta-vaciar").onclick = () => { estado.cesta = []; pintarCesta(); };
      cont.querySelector("#cesta-pedir").onclick = async () => {
        const lineas = estado.cesta.filter((i) => i.tipo === "producto").map((i) => ({ subproducto_id: i.id, cantidad_pedida: i.cantidad }));
        const paquetes = estado.cesta.filter((i) => i.tipo === "paquete").map((i) => ({ paquete_id: i.id, cantidad: i.cantidad }));
        try {
          const creados = await api("/pedidos/multiple", { method: "POST", body: JSON.stringify({ lineas, paquetes }) });
          estado.cesta = [];
          pintarCesta();
          await pintarTablaPedidos();
          avisar(creados.length > 1
            ? t("pedido_hecho_multiple", "Pedido hecho: {n} pedidos que se entregarán juntos, en un solo albarán, cuando estén todos listos.", { n: creados.length })
            : t("pedido_hecho", "Pedido hecho."));
        } catch (e) { const m = document.getElementById("cesta-error"); if (m) m.textContent = e.message; }
      };
    }
    pintarCesta();

    document.getElementById("form-nuevo-pedido").onsubmit = (ev) => {
      ev.preventDefault();
      const sel = document.getElementById("np-articulo");
      const cantidad = Number(document.getElementById("np-cantidad").value);
      const error = document.getElementById("np-error");
      if (!sel.value) { error.textContent = t("nada_que_pedir", "No hay nada que pedir."); return; }
      if (!Number.isInteger(cantidad) || cantidad < 1) { error.textContent = t("cantidad_1_o_mas", "La cantidad tiene que ser 1 o más."); return; }
      error.textContent = "";
      const [clase, id] = sel.value.split(":");
      const tipo = clase === "q" ? "paquete" : "producto";
      const texto = sel.selectedOptions[0].textContent.split(" -- ")[0];
      const ya = estado.cesta.find((it) => it.tipo === tipo && it.id === Number(id));
      if (ya) ya.cantidad += cantidad;
      else estado.cesta.push({ tipo, id: Number(id), cantidad, texto });
      pintarCesta();
    };
  }

  async function pintarTablaPedidos() {
    const [pedidos, clientes] = await Promise.all([
      api("/pedidos"),
      esInterno() ? api("/clientes") : Promise.resolve([]),
    ]);
    const clientesPorId = {};
    clientes.forEach((c) => { clientesPorId[c.id] = c; });

    const f = estado.filtrosPedidos;
    const verCliente = esInterno();
    const verQuien = estado.yo.rol !== ROLES.NORMAL;

    const activosEstados = ["pendiente", "en_proceso", "listo"];
    let activos = pedidos.filter((p) => activosEstados.includes(p.estado));
    const historico = pedidos
      .filter((p) => !activosEstados.includes(p.estado))
      .sort((a, b) => new Date(b.creado_en) - new Date(a.creado_en));

    function pasaFiltros(p) {
      if (f.cliente && String(p.cliente_id) !== f.cliente) return false;
      if (f.producto && String(p.producto_id) !== f.producto) return false;
      if (f.estado && p.estado !== f.estado) return false;
      if (f.enAlmacen === "cubre_todo" && !(p.stock_disponible >= (p.cantidad_pedida - p.cantidad_completada))) return false;
      if (f.enAlmacen === "cubre_parte" && !(p.stock_disponible > 0 && p.stock_disponible < (p.cantidad_pedida - p.cantidad_completada))) return false;
      if (f.enAlmacen === "sin_stock" && p.stock_disponible > 0) return false;
      return true;
    }
    activos = activos.filter(pasaFiltros);

    const productosUnicos = {};
    pedidos.forEach((p) => { productosUnicos[p.producto_id] = p.producto; });

    function celdaAlmacen(p) {
      const restante = p.cantidad_pedida - p.cantidad_completada;
      if (p.stock_disponible <= 0) return "—";
      if (p.stock_disponible >= restante) return t("cubre_todo", "cubre todo ({n})", { n: p.stock_disponible });
      return t("cubre_parte", "cubre {a} de {b}", { a: p.stock_disponible, b: restante });
    }

    function filaPedido(p, conAcciones) {
      const puedeGestionar = puede("produccion") || estado.yo.rol === ROLES.ADMIN_CLIENTE;
      // /pedidos/{id}/reclamar y /liberar son de Produccion en el backend (ver
      // Taller_Administracion/app/main.py) -- ni se ofrece el control a un
      // admin_cliente, le daria 403 si lo usara. Corregir precios es de Contabilidad.
      const puedeMaquina = puede("produccion");
      const puedePrecio = puede("contabilidad");
      const nombreCliente = etiquetaCliente(clientesPorId[p.cliente_id]) || `#${p.cliente_id}`;
      return `<tr class="${p.urgente ? "urgente" : ""}">
        <td>${p.id}</td>
        ${verCliente ? `<td>${escapeHtml(nombreCliente)}</td>` : ""}
        ${verQuien ? `<td>${escapeHtml(p.usuario.nombre_completo)}${p.usuario.sucursal ? " / " + escapeHtml(p.usuario.sucursal) : ""}</td>` : ""}
        <td>${escapeHtml(p.producto.nombre)} · ${escapeHtml(p.subproducto.nombre)}</td>
        <td>${p.producto.led_codigo
          ? `<span class="bolita" style="background:${escapeHtml((estado.paleta[p.producto.led_codigo] || {}).rgb || "#888")}"></span>${escapeHtml(p.producto.led_codigo)}`
          : `<span style="color:#888">${t("sin_led", "sin LED")}</span>`}</td>
        <td>${p.cantidad_pedida}</td>
        <td title="${t("titulo_precio_ud", "Precio por unidad, sin IVA ({iva} %). Origen: {origen}", { iva: p.iva_porcentaje, origen: origenPrecio(p.precio_origen) })}">${
          p.paquete_pedido_id && p.paquete_precio_centimos !== null
            ? `<small style="color:#9a8f7d" title="${t("titulo_paquete_entero", "El paquete se cobra entero: {n} × {precio}", { n: p.paquete_cantidad, precio: euros(p.paquete_precio_centimos) })}">${t("en_el_paquete", "📦 en el paquete ({precio})", { precio: euros(p.paquete_precio_centimos) })}</small>${conAcciones && puedePrecio && p.cantidad_repartida === 0 ? ` <button data-precio-paquete="${p.paquete_pedido_id}" data-actual="${(p.paquete_precio_centimos / 100).toFixed(2)}" title="${t("titulo_corregir_precio_paquete", "Corregir el precio del paquete (queda en el historial)")}">✎</button>` : ""}`
            : `${p.precio_unitario_centimos ? euros(p.precio_unitario_centimos) : `<span style="color:#e0a030">${t("sin_precio", "sin precio")}</span>`}${p.precio_origen !== "tarifa_general" ? ` <small style="color:#9a8f7d">${p.precio_origen === "manual" ? t("manual_corto", "manual") : t("cliente_corto", "cliente")}</small>` : ""}${conAcciones && puedePrecio && p.cantidad_repartida === 0 ? ` <button data-precio-pedido="${p.id}" data-actual="${(p.precio_unitario_centimos / 100).toFixed(2)}" title="${t("titulo_corregir_precio_pedido", "Corregir el precio de este pedido (queda en el historial)")}">✎</button>` : ""}`}</td>
        <td>${p.cantidad_completada}</td>
        <td>${p.cantidad_repartida}</td>
        <td>${conAcciones ? escapeHtml(celdaAlmacen(p)) : "—"}</td>
        <td class="estado-${p.estado}">${escapeHtml(etiquetaEstado(p.estado))}</td>
        <td title="${t("titulo_maquina_0", "0 = libre, sin asignar todavía a ninguna máquina")}">${conAcciones && puedeMaquina
          ? `<span class="maquina-editor">

        <select id="f-almacen">
          <option value="todos" ${f.enAlmacen === "todos" ? "selected" : ""}>${t("filtro_almacen_todos", "En almacén: todos")}</option>
          <option value="cubre_todo" ${f.enAlmacen === "cubre_todo" ? "selected" : ""}>${t("filtro_cubre_todo", "Cubre todo")}</option>
          <option value="cubre_parte" ${f.enAlmacen === "cubre_parte" ? "selected" : ""}>${t("filtro_cubre_parte", "Cubre parte")}</option>

          <option value="" ${f.estado === "" ? "selected" : ""}>${t("filtro_estado_todos", "Estado: todos")}</option>

          <option value="en_proceso" ${f.estado === "en_proceso" ? "selected" : ""}>${t("estado_en_proceso_cap", "En proceso")}</option>

      <table>
        <thead><tr>${cabPedidos}</tr></thead>
        <tbody>${activos.length ? activos.map((p) => filaPedido(p, true)).join("") :
          `<tr><td colspan="${13 + colspanExtra}">${t("sin_pedidos_activos_filtros", "Sin pedidos activos con estos filtros.")}</td></tr>`}</tbody>

        <tbody>${historico.length ? historico.map((p) => filaPedido(p, false)).join("") :

    document.getElementById("f-almacen").onchange = (e) => { f.enAlmacen = e.target.value; pintarTablaPedidos(); };

    enlazarAccionesPedido(cont, pintarTablaPedidos);
    cont.querySelectorAll("[data-precio-paquete]").forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.precioPaquete;
        const nuevo = prompt(t("prompt_precio_paquete", "Nuevo precio de UN paquete (€, sin IVA):"), btn.dataset.actual);
        if (nuevo === null) return;
        const motivo = prompt(t("prompt_motivo_cambio", "Motivo del cambio (obligatorio, queda en el historial):"));

          pintarTablaPedidos();

    });
    cont.querySelectorAll("[data-precio-pedido]").forEach((btn) => {
      btn.onclick = async () => {

        if (nuevo === null) return;
        const motivo = prompt(t("prompt_motivo_cambio", "Motivo del cambio (obligatorio, queda en el historial):"));
        if (motivo === null) return;
        try {
          await api(`/pedidos/${id}/precio`, { method: "PATCH", body: JSON.stringify({ precio_centimos: centimosDeTexto(nuevo), motivo }) });
          pintarTablaPedidos();
        } catch (e) { avisar(e.message); }

    cont.querySelectorAll("[data-reprocesar]").forEach((btn) => {

        const id = btn.dataset.reprocesar;
        if (!await confirmar(t("confirmar_reprocesar", "¿Volver a mandar al taller el lote del pedido #{id}?\n\nSe crea un pedido nuevo con la misma cantidad; el original se queda en el histórico.", { id }))) return;
        btn.disabled = true;

          const nuevo = await api(`/pedidos/${id}/reprocesar`, { method: "POST" });
          await pintarTablaPedidos();
          avisar(nuevo.estado === "completado"
            ? t("reprocesado_completado", "Pedido #{id} creado y repartido al momento desde el almacén (había stock suficiente).", { id: nuevo.id })
            : nuevo.estado === "listo"
              ? t("reprocesado_listo", "Pedido #{id} creado con las piezas ya listas desde el almacén; falta repartirlo (pestaña Reparto).", { id: nuevo.id })
              : t("reprocesado_cola", "Pedido #{id} creado y en cola para el taller.", { id: nuevo.id }));
        } catch (e) {
          btn.disabled = false;
          avisar(e.message);
        }
      };
    });
  }

      <div id="taller-tabla"></div>`;
    await pintarTablaTaller();
    estado.refrescoPedidos = setInterval(() => {
      if (estado.pestanaActiva === "taller") pintarTablaTaller();

  async function pintarTablaTaller() {

    const clientesPorId = {};
    clientes.forEach((c) => { clientesPorId[c.id] = c; });
    const filas = pedidos
      .filter((p) => ["pendiente", "en_proceso"].includes(p.estado) && p.falta_fabricar > 0)
      .sort((a, b) => (b.urgente - a.urgente) || (new Date(a.creado_en) - new Date(b.creado_en)));
    const cont = document.getElementById("taller-tabla");
    if (!cont) return;
    cont.innerHTML = `
      <table>
        <thead><tr>
          <th>${t("th_id", "ID")}</th><th>${t("th_cliente", "Cliente")}</th><th>${t("th_producto", "Producto")}</th><th>${t("th_color", "Color")}</th><th>${t("th_pedido", "Pedido")}</th><th>${t("th_listas", "Listas")}</th>
          <th>${t("th_cubre_stock", "Cubre el stock")}</th><th>${t("th_falta_fabricar", "Falta fabricar")}</th><th>${t("th_maquina", "Máquina")}</th><th>${t("th_tiempo", "Tiempo")}</th><th>${t("th_urgente", "Urgente")}</th><th>${t("th_creado", "Creado")}</th><th></th>
        </tr></thead>
        <tbody>${filas.length ? filas.map((p) => `
          <tr class="${p.urgente ? "urgente" : ""}">
            <td>${p.id}</td>
            <td>${escapeHtml(etiquetaCliente(clientesPorId[p.cliente_id]) || `#${p.cliente_id}`)}</td>
            <td>${escapeHtml(p.producto.nombre)} · ${escapeHtml(p.subproducto.nombre)}</td>
            <td>${p.producto.led_codigo
              ? `<span class="bolita" style="background:${escapeHtml((estado.paleta[p.producto.led_codigo] || {}).rgb || "#888")}"></span>${escapeHtml(p.producto.led_codigo)}`
              : `<span style="color:#888">${t("sin_led", "sin LED")}</span>`}</td>
            <td>${p.cantidad_pedida}</td>
            <td>${p.cantidad_completada}</td>
            <td>${p.stock_disponible > 0 ? p.stock_disponible : "—"}</td>
            <td><b>${p.falta_fabricar}</b></td>
            <td title="${t("titulo_maquina_0", "0 = libre, sin asignar todavía a ninguna máquina")}"><span class="maquina-editor">
              <input type="number" min="0" max="99" value="${p.numero_maquina}" data-maquina-input="${p.id}" style="width:5.5em" />
              <button data-maquina-asignar="${p.id}" title="${t("titulo_asignar_maquina", "Asignar este número a mano (fuerza, salta la comprobación de libre/mío)")}">✓</button>
              ${p.numero_maquina ? `<button data-maquina-liberar="${p.id}" title="${t("titulo_liberar_maquina", "Volver a poner en libre (0)")}">${t("liberar", "Liberar")}</button>` : ""}
            </span></td>
            <td title="${escapeHtml(tituloTiempoProceso(p.segundos_proceso, p.segundos_total))}">${escapeHtml(celdaTiempoProceso(p.segundos_proceso))}</td>
            <td><input type="checkbox" data-urgente="${p.id}" ${p.urgente ? "checked" : ""} /></td>
            <td>${fechaLocal(p.creado_en)}</td>
            <td>${p.estado === "pendiente" ? `<button data-cancelar="${p.id}">${t("cancelar", "Cancelar")}</button>` : ""}</td>

  // ---------------------------------------------------------------- reparto

  async function renderReparto() {
    const cont = document.getElementById("contenido");
    cont.innerHTML = `<h2>${t("tab_reparto", "Reparto")}</h2>
      <p class="ayuda">${t("ayuda_reparto", "La segunda etapa de un pedido: las piezas ya están <b>listas</b> (o las cubre el stock) y falta <b>entregarlas al cliente</b>. Al repartir se genera un <b>albarán</b> por cliente, que es lo que se facturará más adelante. Hay dos interruptores: el <b>reparto automático</b> asigna solo el stock libre a los pedidos (si lo apagas, el botón <b>Asignar stock</b> lo hace a mano), y el <b>reparto automático de lo listo</b> entrega solo los pedidos completos. Apagado, el pedido espera aquí hasta que lo repartas tú; repartir un pedido que solo lo cubre el stock lo asigna y lo entrega de una vez.")}</p>
      <div id="reparto-config"></div><div id="reparto-tabla"></div>`;
    await pintarReparto();
    estado.refrescoPedidos = setInterval(() => {
      if (estado.pestanaActiva === "reparto") pintarReparto();
    }, 4000);
  }

  async function pintarReparto() {
    const [config, pedidos, clientes, repartos] = await Promise.all([
      api("/almacen/configuracion"), api("/pedidos"), api("/clientes"), api("/repartos?limite=50"),
    ]);
    const cont = document.getElementById("reparto-config");
    if (!cont) return;
    const clientesPorId = {};
    clientes.forEach((c) => { clientesPorId[c.id] = c; });
    const pendientes = pedidos
      .filter((p) => ["pendiente", "en_proceso", "listo"].includes(p.estado) && p.para_repartir > 0)
      .sort((a, b) => (b.urgente - a.urgente) || (new Date(a.creado_en) - new Date(b.creado_en)));
    // La seleccion sobrevive al repintado de cada 4 s; se descartan los que ya no estan.
    const seleccion = estado.seleccionReparto || (estado.seleccionReparto = new Set());
    const idsPendientes = new Set(pendientes.map((p) => p.id));
    [...seleccion].forEach((id) => { if (!idsPendientes.has(id)) seleccion.delete(id); });

    cont.innerHTML = `
      <label><input type="checkbox" id="rep-auto-stock" ${config.reparto_automatico ? "checked" : ""} /> ${t("reparto_auto_stock", "Reparto automático (asignar el stock a los pedidos)")}</label><br>
      <label><input type="checkbox" id="rep-auto-expedir" ${config.expedicion_automatica ? "checked" : ""} /> ${t("reparto_auto_expedir", "Reparto automático de lo listo (entregar y emitir albarán)")}</label><br>
      <button id="rep-asignar" style="margin-top:6px" title="${t("titulo_asignar_stock", "Reserva el stock libre para los pedidos que lo cubren, sin entregarlo todavía")}">${t("asignar_stock_pendientes", "Asignar stock a pedidos pendientes")}</button>`;
    cont.querySelector("#rep-auto-stock").onchange = async (e) => {
      await api("/almacen/configuracion", { method: "PATCH", body: JSON.stringify({ reparto_automatico: e.target.checked }) });
    };
    cont.querySelector("#rep-asignar").onclick = async () => {
      try {
        const r = await api("/almacen/repartir", { method: "POST" });
        await pintarReparto();
        const m = document.getElementById("rep-msg");
        if (m) m.textContent = r.repartidos.length
          ? t("stock_asignado_n", "Stock asignado a {n} pedido(s).", { n: r.repartidos.length })
          : t("sin_stock_libre_asignar", "No había stock libre que asignar.");
      } catch (e) { avisar(e.message); }
    };
    cont.querySelector("#rep-auto-expedir").onchange = async (e) => {
      await api("/almacen/configuracion", { method: "PATCH", body: JSON.stringify({ expedicion_automatica: e.target.checked }) });
      pintarReparto();
    };

    const tabla = document.getElementById("reparto-tabla");
    tabla.innerHTML = `
      <h3>${t("pendientes_reparto", "Pendientes de reparto")}</h3>
      <p>
        <button id="rep-sel" ${seleccion.size ? "" : "disabled"}>${t("repartir_seleccionados_n", "Repartir seleccionados ({n})", { n: seleccion.size })}</button>
        <button id="rep-todo" ${pendientes.length ? "" : "disabled"}>${t("repartir_todo", "Repartir todo")}</button>
        <span id="rep-msg" style="margin-left:12px"></span>
      </p>
      <table>
        <thead><tr>
          <th></th><th>${t("th_id", "ID")}</th><th>${t("th_cliente", "Cliente")}</th><th>${t("th_producto", "Producto")}</th><th>${t("th_pedido", "Pedido")}</th><th>${t("th_ya_repartido", "Ya repartido")}</th>
          <th>${t("th_listas", "Listas")}</th><th>${t("th_cubre_stock", "Cubre el stock")}</th><th>${t("th_a_entregar", "A entregar")}</th><th>${t("th_estado", "Estado")}</th><th>${t("th_creado", "Creado")}</th><th></th>
        </tr></thead>
        <tbody>${pendientes.length ? pendientes.map((p) => `
          <tr class="${p.urgente ? "urgente" : ""}">
            <td><input type="checkbox" data-sel="${p.id}" ${seleccion.has(p.id) ? "checked" : ""} /></td>
            <td>${p.id}</td>
            <td>${escapeHtml(etiquetaCliente(clientesPorId[p.cliente_id]) || `#${p.cliente_id}`)}</td>
            <td>${escapeHtml(p.producto.nombre)} · ${escapeHtml(p.subproducto.nombre)}${p.paquete_nombre ? `<br><small style="color:#9a8f7d" title="${t("titulo_paquete_junto", "Un paquete se reparte entero, en un solo albarán")}">📦 ${escapeHtml(p.paquete_nombre)}</small>` : ""}${p.grupo_entrega ? `<br><small style="color:#9a8f7d" title="${t("titulo_entrega_conjunta", "Se pidió junto con otros: se reparte todo en un solo albarán")}">🛒 ${t("entrega_conjunta", "entrega conjunta")}</small>` : ""}</td>
            <td>${p.cantidad_pedida}</td>
            <td>${p.cantidad_repartida}</td>
            <td>${p.cantidad_completada - p.cantidad_repartida}</td>
            <td title="${t("titulo_stock_libre_pedido", "Stock libre que cubre este pedido pero aún no está asignado a él")}">${p.stock_disponible > 0 ? p.stock_disponible : "—"}</td>
            <td><b>${p.para_repartir}</b></td>
            <td class="estado-${p.estado}">${escapeHtml(etiquetaEstado(p.estado))}</td>
            <td>${fechaLocal(p.creado_en)}</td>
            <td><button data-repartir="${p.id}">${t("repartir", "Repartir")}</button></td>
          </tr>`).join("") : `<tr><td colspan="12">${t("nada_pendiente_reparto", "Nada pendiente de reparto.")}</td></tr>`}</tbody>
      </table>
      <h3>${t("albaranes_emitidos", "Albaranes emitidos")}</h3>
      ${tablaAlbaranes(repartos, true, puede("contabilidad"))}`;

    async function repartir(ids) {
      const msg = document.getElementById("rep-msg");
      try {
        const emitidos = await api("/reparto/expedir", { method: "POST", body: JSON.stringify({ pedido_ids: ids }) });
        seleccion.clear();
        await pintarReparto();
        const m = document.getElementById("rep-msg");
        if (m) m.textContent = emitidos.length
          ? t("emitidos_lista", "Emitido(s): {lista}", { lista: emitidos.map((r) => r.numero).join(", ") })
          : t("nada_que_entregar", "No había nada que entregar.");
      } catch (e) { if (msg) msg.textContent = e.message; else avisar(e.message); }
    }
    tabla.querySelectorAll("[data-sel]").forEach((chk) => {
      chk.onchange = () => {
        const id = Number(chk.dataset.sel);
        if (chk.checked) seleccion.add(id); else seleccion.delete(id);
        const b = document.getElementById("rep-sel");
        b.disabled = seleccion.size === 0;
        b.textContent = t("repartir_seleccionados_n", "Repartir seleccionados ({n})", { n: seleccion.size });
      };
    });
    tabla.querySelectorAll("[data-repartir]").forEach((btn) => {
      btn.onclick = () => repartir([Number(btn.dataset.repartir)]);
    });
    document.getElementById("rep-sel").onclick = () => repartir([...seleccion]);
    document.getElementById("rep-todo").onclick = () => repartir(null);
    enlazarAlbaranes(tabla, repartos, pintarReparto);
  }

          text-transform: uppercase; letter-spacing: 0.02em; font-size: 24px; color: #1a1a1a; }

      <p class="no-print"><button onclick="window.print()">${t("imprimir_guardar_pdf", "Imprimir / guardar PDF")}</button></p></body></html>`);

  }

  // Solo de cara a imprimir (ver factor_piezas en Facturacion): clona el documento y multiplica
  // cantidad e importes por el factor. El precio unitario NO se toca, asi que sigue cuadrando
  // (cantidad_nueva x precio = importe_nuevo). No se guarda en ningun sitio, es un dibujo aparte.
  function escalarPorFactor(doc, factor) {
    if (!factor || factor === 1) return doc;
    const d = JSON.parse(JSON.stringify(doc));
    (d.lineas || []).forEach((l) => {
      l.cantidad *= factor;
      if (l.paquete_cantidad != null) l.paquete_cantidad *= factor;
      l.base_centimos = Math.round(l.base_centimos * factor);
    });
    (d.desglose_iva || []).forEach((tramo) => {
      tramo.base_centimos = Math.round(tramo.base_centimos * factor);
      tramo.iva_centimos = Math.round(tramo.iva_centimos * factor);
    });
    d.base_centimos = Math.round(d.base_centimos * factor);
    d.iva_centimos = Math.round(d.iva_centimos * factor);
    d.total_centimos = Math.round(d.total_centimos * factor);
    return d;
  }

  function notaFactorPiezas(factor) {
    return factor > 1
      ? `<p class="peq">${t("nota_factor_piezas", "Nota: cantidades e importes multiplicados ×{factor} respecto al pedido real, para ver aquí una factura con más piezas y más volumen (factor de demo, configurable en Facturación — no afecta al stock ni a la contabilidad real).", { factor })}</p>`
      : "";
  }

  function filasIva(desglose) {
    return desglose.map((d) => `<tr><td>${d.iva_porcentaje} %</td><td class="num">${euros(d.base_centimos)}</td><td class="num">${euros(d.iva_centimos)}</td></tr>`).join("");
  }

  // Agrupa las lineas de un albaran/factura: las de un paquete van juntas bajo su cabecera.
  //  - paquete CON precio propio: una linea "paquete" (con precio) + sus componentes SIN precio.
  //  - paquete SIN precio propio: sus productos, cada uno con el suyo, agrupados bajo el nombre.
  function agruparLineas(lineas) {
    const bloques = [], porPaquete = {};
    lineas.forEach((l) => {
      if (!l.paquete_pedido_id) { bloques.push({ paquete: false, linea: l }); return; }
      let b = porPaquete[l.paquete_pedido_id];
      if (!b) {
        b = porPaquete[l.paquete_pedido_id] = { paquete: true, nombre: l.paquete_nombre, cantidad: l.paquete_cantidad, cabecera: null, componentes: [] };
        bloques.push(b);
      }
      if (l.tipo === "paquete") b.cabecera = l; else b.componentes.push(l);
    });
    return bloques;
  }

  function filasFactura(f) {
    const vacio = `<td class="num"></td>`;
    const celdas = (l) => `<td class="num">${euros(l.precio_unitario_centimos)}</td><td class="num">${l.iva_porcentaje} %</td><td class="num">${euros(l.base_centimos)}</td>`;
    const alb = (l) => escapeHtml((l && l.albaran_numero) || "");
    return agruparLineas(f.lineas).map((b) => {
      if (!b.paquete) return `<tr><td>${alb(b.linea)}</td><td>${escapeHtml(b.linea.descripcion)}</td><td class="num">${b.linea.cantidad}</td>${celdas(b.linea)}</tr>`;
      const cab = b.cabecera;
      let html = cab
        ? `<tr><td>${alb(cab)}</td><td><b>📦 ${escapeHtml(cab.descripcion)}</b></td><td class="num">${cab.cantidad}</td>${celdas(cab)}</tr>`
        : `<tr><td>${alb(b.componentes[0])}</td><td><b>📦 ${escapeHtml(b.nombre)}</b> × ${b.cantidad} <span class="peq">(${t("se_cobra_por_productos", "se cobra por productos")})</span></td><td></td>${vacio}${vacio}${vacio}</tr>`;
      b.componentes.forEach((l) => {
        html += `<tr><td></td><td style="padding-left:22px">${t("incluye", "incluye")}: ${escapeHtml(l.descripcion)}</td><td class="num">${l.cantidad}</td>${l.tipo === "componente" ? `${vacio}${vacio}${vacio}` : celdas(l)}</tr>`;
      });
      return html;
    }).join("");
  }

  function filasAlbaran(r, conPrecio) {
    const vacio = conPrecio ? `<td class="num"></td><td class="num"></td>` : "";
    const celdas = (l) => (conPrecio ? `<td class="num">${euros(l.precio_unitario_centimos)}</td><td class="num">${euros(l.base_centimos)}</td>` : "");
    return agruparLineas(r.lineas).map((b) => {
      if (!b.paquete) return `<tr><td>${escapeHtml(b.linea.descripcion)}</td><td>#${b.linea.pedido_id}</td><td class="num">${b.linea.cantidad}</td>${celdas(b.linea)}</tr>`;
      const cab = b.cabecera;
      let html = cab
        ? `<tr><td><b>📦 ${escapeHtml(cab.descripcion)}</b></td><td></td><td class="num">${cab.cantidad}</td>${celdas(cab)}</tr>`
        : `<tr><td><b>📦 ${escapeHtml(b.nombre)}</b> × ${b.cantidad}</td><td></td><td></td>${vacio}</tr>`;
      b.componentes.forEach((l) => {
        html += `<tr><td style="padding-left:22px">${t("incluye", "incluye")}: ${escapeHtml(l.descripcion)}</td><td>#${l.pedido_id}</td><td class="num">${l.cantidad}</td>${l.tipo === "componente" ? vacio : celdas(l)}</tr>`;
      });
      return html;
    }).join("");
  }

  // Lineas de un albaran en texto corto (tabla de Facturacion): el paquete y, debajo, lo que lleva.
  function resumenLineas(r) {
    return agruparLineas(r.lineas).map((b) => b.paquete
      ? `<b>📦 ${b.cantidad} × ${escapeHtml(b.nombre)}</b>${b.cabecera ? ` ${t("a_precio", "a {precio}", { precio: euros(b.cabecera.precio_unitario_centimos) })}` : ""}<br>` +
        b.componentes.map((l) => `<span style="color:#9a8f7d;margin-left:1.2em">· ${l.cantidad} × ${escapeHtml(l.descripcion)}</span>`).join("<br>")
      : `${b.linea.cantidad} × ${escapeHtml(b.linea.descripcion)}`).join("<br>");
  }

    return `

          ${f.estado === "anulada" ? `<p><span class="marca">${t("anulada", "ANULADA")}${f.rectificada_por_numero ? ` (${escapeHtml(f.rectificada_por_numero)})` : ""}</span></p>` : ""}

      <p>${t("base_imponible_dosp", "Base imponible")}: ${euros(f.base_centimos)} &nbsp; ${t("th_iva", "IVA")}: ${euros(f.iva_centimos)}</p>
      <p class="total">${t("total_mayus", "TOTAL")}: ${euros(f.total_centimos)}</p>
      ${f.cobrada ? `<p>${t("cobrada_el", "Cobrada el {fecha}", { fecha: fechaLocal(f.fecha_pago) })}${f.metodo_pago ? ` (${escapeHtml(f.metodo_pago)})` : ""}.</p>` : ""}
      <p class="peq">${t("nota_factura_produccion", "Nota: esta es la factura de producción, pero todavía le faltan conceptos que llevaría una factura real (transporte, envío, recargos u otros gastos).")}</p>
      ${notaFactorPiezas(estado.factorPiezas)}`;
  }

  // El anagrama sale de la cabecera de la propia pagina (una sola fuente): si cambia alli, cambia aqui.

  function tablaAlbaranes(repartos, verCliente, admin) {
    if (!repartos.length) return `<p style="color:#9a8f7d">${t("todavia_no_hay_albaranes", "Todavía no hay albaranes.")}</p>`;
    return `<table>
      <thead><tr><th>${t("th_albaran", "Albarán")}</th><th>${t("th_fecha", "Fecha")}</th>${verCliente ? `<th>${t("th_cliente", "Cliente")}</th>` : ""}<th>${t("th_lineas", "Líneas")}</th>
        <th>${t("th_base", "Base")}</th><th>${t("th_iva", "IVA")}</th><th>${t("th_total", "Total")}</th><th>${t("th_factura", "Factura")}</th><th>${t("th_salida", "Salida")}</th><th></th></tr></thead>
      <tbody>${repartos.map((r) => `
        <tr>
          <td><code>${escapeHtml(r.numero)}</code></td>
          <td>${fechaLocal(r.fecha)}</td>
          ${verCliente ? `<td>${escapeHtml(etiquetaCliente(r.cliente))}</td>` : ""}
          <td>${agruparLineas(r.lineas).map((b) => {
            const precio = (l) => (l.precio_unitario_centimos ? `<span style="color:#9a8f7d">${t("a_precio", "a {precio}", { precio: euros(l.precio_unitario_centimos) })}</span>` : `<span style="color:#e0a030">${t("sin_precio", "sin precio")}</span>`);
            const editar = (l) => (admin && !r.factura_numero ? ` <button data-precio-linea="${l.id}" data-actual="${(l.precio_unitario_centimos / 100).toFixed(2)}" title="${t("titulo_corregir_precio_linea", "Corregir el precio de esta línea (queda en el historial)")}">✎</button>` : "");
            const suelta = (l) => `${l.cantidad} × ${escapeHtml(l.descripcion)} <span style="color:#888">(${t("pedido_numeral", "pedido #{id}", { id: l.pedido_id })})</span> ${precio(l)}${editar(l)}`;
            if (!b.paquete) return suelta(b.linea);
            const cab = b.cabecera
              ? `<b>📦 ${b.cantidad} × ${escapeHtml(b.nombre)}</b> ${precio(b.cabecera)}${editar(b.cabecera)}`
              : `<b>📦 ${b.cantidad} × ${escapeHtml(b.nombre)}</b> <span style="color:#9a8f7d">(${t("se_cobra_por_productos", "se cobra por productos")})</span>`;
            const dentro = b.componentes.map((l) => l.tipo === "componente"
              ? `<span style="color:#9a8f7d">· ${l.cantidad} × ${escapeHtml(l.descripcion)}</span>`
              : `<span style="margin-left:0">· ${suelta(l)}</span>`).join("<br>");
            return `${cab}<div style="margin-left:1.2em">${dentro}</div>`;

          <td>${r.total_centimos ? `<b>${euros(r.total_centimos)}</b>` : "—"}</td>
          <td>${r.factura_numero ? `<code>${escapeHtml(r.factura_numero)}</code>` : `<span style="color:#9a8f7d">${t("sin_facturar_min", "sin facturar")}</span>`}</td>

  // Ver/imprimir y corregir precio de linea: los comparten Reparto y Albaranes.
  function enlazarAlbaranes(cont, repartos, repintar) {
    cont.querySelectorAll("[data-ver-albaran]").forEach((btn) => {
      btn.onclick = async () => {
        const r = repartos.find((x) => x.id === Number(btn.dataset.verAlbaran));
        let emisor = null;
        // Solo administracion puede leer las empresas; un cliente ve el albaran sin cabecera de emisor.
        try { const l = await api("/emisores"); emisor = l.find((e) => e.por_defecto) || l[0] || null; } catch (e) { /* se ve igual */ }
        abrirDocumento(t("albaran_num", "Albarán {numero}", { numero: r.numero }), htmlAlbaran(r, emisor));
      };
    });
    cont.querySelectorAll("[data-precio-linea]").forEach((btn) => {
      btn.onclick = async () => {
        const nuevo = prompt(t("prompt_precio_unitario", "Nuevo precio por unidad (€, sin IVA):"), btn.dataset.actual);
        if (nuevo === null) return;
        const motivo = prompt(t("prompt_motivo_cambio", "Motivo del cambio (obligatorio, queda en el historial):"));
        if (motivo === null) return;
        try {
          await api(`/repartos/lineas/${btn.dataset.precioLinea}/precio`, { method: "PATCH",
            body: JSON.stringify({ precio_centimos: centimosDeTexto(nuevo), motivo }) });
          repintar();
        } catch (e) { avisar(e.message); }
      };
    });
  }

  function descargarCsv(nombre, filas) {
    // ';' y coma decimal, con BOM: es lo que abre bien Excel en espanol.
    const celda = (v) => `"${String(v === null || v === undefined ? "" : v).replaceAll('"', '""')}"`;
    const texto = "﻿" + filas.map((f) => f.map(celda).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: "text/csv;charset=utf-8" }));
    a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
  }
  const eurosCsv = (c) => (c / 100).toFixed(2).replace(".", ",");

  async function renderResumenContable() {
    const cont = document.getElementById("contenido");
    const admin = esInterno();
    const [facturas, repartos] = await Promise.all([api("/facturas?limite=2000"), api("/repartos?limite=2000")]);
    const ahora = new Date();
    const vigentes = facturas.filter((f) => f.tipo === "factura" && f.estado === "emitida");
    const anio = (iso) => new Date(iso.endsWith("Z") ? iso : iso + "Z").getFullYear();
    const mes = (iso) => new Date(iso.endsWith("Z") ? iso : iso + "Z").getMonth();
    const dias = (iso) => Math.floor((ahora - new Date(iso.endsWith("Z") ? iso : iso + "Z")) / 86400000);
    const suma = (lista, campo = "total_centimos") => lista.reduce((t, x) => t + x[campo], 0);
    const esteAnio = vigentes.filter((f) => anio(f.fecha) === ahora.getFullYear());
    const esteMes = esteAnio.filter((f) => mes(f.fecha) === ahora.getMonth());
    const cobradas = esteAnio.filter((f) => f.cobrada);
    const pendientes = vigentes.filter((f) => !f.cobrada);
    const sinFacturar = repartos.filter((r) => !r.factura_numero);
    const sinPrecio = sinFacturar.filter((r) => r.lineas.some((l) => l.precio_unitario_centimos === 0 && l.tipo !== "componente")).length;
    const tramos = [[t("hasta_30_dias", "hasta 30 días"), (d) => d <= 30], [t("de_31_a_60_dias", "31 a 60 días"), (d) => d > 30 && d <= 60], [t("mas_de_60_dias", "más de 60 días"), (d) => d > 60]];

    const kpi = (titulo, valor, detalle, color) => `<div class="kpi"><div class="kpi-t">${titulo}</div>

      const g = {};
      const fila = (c) => g[c.id || c] || (g[c.id || c] = { nombre: c.razon_social || c.cliente_razon_social, facturado: 0, cobrado: 0, pendiente: 0, sinFacturar: 0 });
      vigentes.forEach((f) => { const x = fila({ id: f.cliente_id, razon_social: f.cliente_razon_social }); x.facturado += f.total_centimos; if (f.cobrada) x.cobrado += f.total_centimos; else x.pendiente += f.total_centimos; });
      sinFacturar.forEach((r) => { fila(r.cliente).sinFacturar += r.total_centimos; });

          <td style="${x.pendiente ? "color:#e0a030;font-weight:600" : ""}">${euros(x.pendiente)}</td><td>${euros(x.sinFacturar)}</td></tr>`).join("")

    }

    cont.innerHTML = `<h2>${t("tab_resumen_conta", "Resumen contable")}</h2>
      <p class="ayuda">${admin ? t("resumen_ayuda_admin", "El estado de las cuentas de un vistazo") : t("resumen_ayuda_cliente", "El estado de las cuentas de tu empresa")}: ${t("resumen_ayuda_resto", 'lo <b>facturado</b>, lo <b>cobrado</b>, lo que <b>queda por cobrar</b> y lo ya entregado que <b>todavía no se ha facturado</b>. Solo cuentan las facturas vigentes: una anulada (con su rectificativa) no suma. Los importes llevan IVA incluido. Cobrar y facturar se hace en la pestaña Facturación.')}</p>
      <div class="kpis">
        ${kpi(t("facturado_este_mes", "Facturado este mes"), euros(suma(esteMes)), t("n_facturas", "{n} factura(s)", { n: esteMes.length }))}
        ${kpi(t("facturado_en_anio", "Facturado en {anio}", { anio: ahora.getFullYear() }), euros(suma(esteAnio)), t("n_facturas_iva", "{n} factura(s) · IVA repercutido {iva}", { n: esteAnio.length, iva: euros(suma(esteAnio, "iva_centimos")) }))}
        ${kpi(t("cobrado_en_anio", "Cobrado en {anio}", { anio: ahora.getFullYear() }), euros(suma(cobradas)), t("n_facturas", "{n} factura(s)", { n: cobradas.length }), "#2e9e3b")}
        ${kpi(t("pendiente_de_cobro", "Pendiente de cobro"), euros(suma(pendientes)), t("n_facturas_sin_cobrar", "{n} factura(s) emitida(s) sin cobrar", { n: pendientes.length }), pendientes.length ? "#e0a030" : "")}
        ${kpi(t("entregado_sin_facturar", "Entregado sin facturar"), euros(suma(sinFacturar)), t("n_albaranes", "{n} albarán(es)", { n: sinFacturar.length }) + (sinPrecio ? ` · <span style="color:#e0a030">⚠ ${t("n_con_lineas_sin_precio", "{n} con líneas sin precio", { n: sinPrecio })}</span>` : ""))}
      </div>
      <h3>${t("pendiente_cobro_antiguedad", "Lo pendiente de cobro, por antigüedad")}</h3>
      <table style="width:auto"><thead><tr><th>${t("th_antiguedad_factura", "Antigüedad de la factura")}</th><th>${t("th_facturas", "Facturas")}</th><th>${t("th_importe", "Importe")}</th></tr></thead>
        <tbody>${tramos.map(([tr, ok]) => { const l = pendientes.filter((f) => ok(dias(f.fecha))); return `<tr><td>${tr}</td><td>${l.length}</td><td>${euros(suma(l))}</td></tr>`; }).join("")}</tbody></table>
      ${porCliente}

      <p><button id="res-csv" ${facturas.length ? "" : "disabled"}>${t("descargar_libro_facturas", "Descargar libro de facturas (CSV)")}</button>

    cont.querySelector("#res-csv").onclick = () => {
      const cab = [t("csv_numero", "Número"), t("csv_tipo", "Tipo"), t("csv_fecha", "Fecha"), t("csv_empresa_emisora", "Empresa emisora"), t("th_cliente", "Cliente"), t("cif", "CIF"), t("th_base", "Base"), t("th_iva", "IVA"), t("th_total", "Total"), t("th_estado", "Estado"), t("csv_cobrada", "Cobrada"), t("csv_fecha_cobro", "Fecha cobro"), t("csv_metodo_cobro", "Método cobro"), t("csv_rectifica_a", "Rectifica a")];
      const fecha = (iso) => (iso ? new Date(iso.endsWith("Z") ? iso : iso + "Z").toLocaleDateString("es-ES") : "");
      const filas = [...facturas].reverse().map((f) => [f.numero, f.tipo, fecha(f.fecha), f.emisor_razon_social || "", f.cliente_razon_social, f.cliente_cif,

      descargarCsv(`facturas-${ahora.toISOString().slice(0, 10)}.csv`, [cab, ...filas]);

  // ------------------------------------------------------------ facturacion

  function etiquetaFactura(f) {
    if (f.tipo === "rectificativa") return { texto: t("factura_rectificativa_min", "rectificativa"), color: "#e0a030" };
    if (f.estado === "anulada") return { texto: t("anulada_min", "anulada"), color: "#c0392b" };
    if (f.cobrada) return { texto: t("cobrada_min", "cobrada"), color: "#2e9e3b" };
    return { texto: t("emitida_sin_cobrar", "emitida · sin cobrar"), color: "#4aa3df" };
  }

  function tablaFacturas(facturas, admin) {
    if (!facturas.length) return `<p style="color:#9a8f7d">${t("todavia_no_hay_facturas", "Todavía no hay facturas.")}</p>`;
    return `<table>
      <thead><tr><th>${t("th_factura", "Factura")}</th><th>${t("th_fecha", "Fecha")}</th><th>${t("th_cliente", "Cliente")}</th><th>${t("th_albaranes", "Albaranes")}</th><th>${t("th_base", "Base")}</th><th>${t("th_iva", "IVA")}</th><th>${t("th_total", "Total")}</th><th>${t("th_estado", "Estado")}</th><th></th></tr></thead>
      <tbody>${facturas.map((f) => {
        const e = etiquetaFactura(f);
        return `<tr>
          <td><code>${escapeHtml(f.numero)}</code>${f.rectifica_numero ? `<br><span style="color:#888">${t("rectifica", "rectifica")} ${escapeHtml(f.rectifica_numero)}</span>` : ""}</td>
          <td>${fechaLocal(f.fecha)}</td>
          <td>${escapeHtml(f.cliente_razon_social)}</td>
          <td>${f.albaranes.map((a) => `<code>${escapeHtml(a)}</code>`).join(" ")}</td>
          <td>${euros(f.base_centimos)}</td><td>${euros(f.iva_centimos)}</td><td><b>${euros(f.total_centimos)}</b></td>
          <td style="color:${e.color}">${e.texto}${f.rectificada_por_numero ? `<br><span style="color:#888">${escapeHtml(f.rectificada_por_numero)}</span>` : ""}</td>
          <td><button data-ver-factura="${f.id}">${t("ver_imprimir", "Ver / imprimir")}</button>

  function enlazarFacturas(cont, facturas, repintar) {
    cont.querySelectorAll("[data-ver-factura]").forEach((btn) => {
      btn.onclick = () => {
        const f = facturas.find((x) => x.id === Number(btn.dataset.verFactura));
        abrirDocumento(t("factura_num", "Factura {numero}", { numero: f.numero }), htmlFactura(f));
      };
    });
    cont.querySelectorAll("[data-cobrar]").forEach((btn) => {
      btn.onclick = async () => {
        const metodo = prompt(t("prompt_metodo_cobro", "Método de cobro (transferencia, efectivo, tarjeta...). Puede quedar vacío:"), t("transferencia", "transferencia"));
        if (metodo === null) return;
        try { await api(`/facturas/${btn.dataset.cobrar}/pagar`, { method: "POST", body: JSON.stringify({ metodo_pago: metodo }) }); repintar(); }
        catch (e) { avisar(e.message); }
      };
    });
    cont.querySelectorAll("[data-anular]").forEach((btn) => {
      btn.onclick = async () => {
        const f = facturas.find((x) => x.id === Number(btn.dataset.anular));
        const motivo = prompt(t("prompt_motivo_anular", "Se anulará {numero} emitiendo su factura rectificativa, y sus albaranes quedarán libres para volver a facturarse.\n\nMotivo (obligatorio):", { numero: f.numero }));
        if (motivo === null) return;
        try {
          const rect = await api(`/facturas/${f.id}/anular`, { method: "POST", body: JSON.stringify({ motivo }) });
          await repintar();
          avisar(t("emitida_rect", "Emitida {rect}. Los albaranes de {numero} están otra vez pendientes de facturar.", { rect: rect.numero, numero: f.numero }));
        } catch (e) { avisar(e.message); }
      };
    });
  }

  async function renderFacturacion() {
    const cont = document.getElementById("contenido");
    const seleccion = estado.seleccionFacturar || (estado.seleccionFacturar = new Set());
    async function pintar() {
      const [emisores, repartos, facturas, config] = await Promise.all([
        api("/emisores"), api("/repartos?limite=500"), api("/facturas?limite=200"), api("/almacen/configuracion"),
      ]);
      estado.factorPiezas = config.factor_piezas || 1;
      const pendientes = repartos.filter((r) => !r.factura_numero);
      const idsPend = new Set(pendientes.map((r) => r.id));
      [...seleccion].forEach((id) => { if (!idsPend.has(id)) seleccion.delete(id); });
      const porCliente = {};
      pendientes.forEach((r) => { (porCliente[r.cliente_id] = porCliente[r.cliente_id] || { cliente: r.cliente, repartos: [] }).repartos.push(r); });
      const activos = emisores.filter((e) => e.activo);
      const porDefecto = activos.find((e) => e.por_defecto) || activos[0];
      if (!estado.emisorFacturar || !activos.some((e) => String(e.id) === estado.emisorFacturar)) {
        estado.emisorFacturar = porDefecto ? String(porDefecto.id) : "";
      }
      cont.innerHTML = `<h2>${t("tab_facturacion", "Facturación")}</h2>
        <p class="ayuda">${t("ayuda_facturacion", "La factura recoge los <b>albaranes</b> de un cliente que aún no se han facturado: copia sus líneas, precios y los datos fiscales de las dos partes, y ya no cambia. Si hay un error, no se edita: se <b>anula</b> emitiendo una factura rectificativa (numeración propia RECT), y los albaranes quedan libres para facturarse de nuevo, ya corregidos. Antes de facturar hace falta que el cliente tenga CIF y dirección (pestaña Clientes); eliges con qué empresa se factura (puede haber varias) y que estén los datos de quien factura (Administración → Empresas). Las líneas a 0 € se rechazan por si falta un precio.")}</p>
        <p class="demo-factor">⚠ <b>${t("factor_piezas_titulo", "Factor de piezas al imprimir (solo demo)")}</b>:
          <select id="fac-factor">${[1, 10, 100, 1000].map((n) => `<option value="${n}" ${n === estado.factorPiezas ? "selected" : ""}>×${n}</option>`).join("")}</select>
          ${t("factor_piezas_ayuda", "multiplica cantidad e importe <b>solo al ver/imprimir</b> un albarán o factura ya emitidos, para que se vean con más piezas y más volumen. No cambia nada en la base de datos: el stock, el reparto y la contabilidad real siguen con los números de verdad.")}</p>
        ${activos.length ? `<p>${t("facturar_como", "Facturar como")} <select id="fac-emisor">${activos.map((e) =>
            `<option value="${e.id}" ${String(e.id) === estado.emisorFacturar ? "selected" : ""}>${escapeHtml(e.razon_social)} (${t("cif", "CIF")} ${escapeHtml(e.cif)}) · ${t("serie_min", "serie")} ${escapeHtml(e.serie_facturas)}</option>`).join("")}</select>
          <button id="ir-empresa">${t("gestionar_empresas", "Gestionar empresas")}</button></p>`
          : `<p style="color:#e0a030">⚠ ${t("sin_empresa_facturar", "No hay ninguna empresa que pueda facturar.")} <button id="ir-empresa">${t("crear_en_administracion_empresas", "Crear una en Administración → Empresas")}</button></p>`}
        <h3>${t("albaranes_pendientes_facturar", "Albaranes pendientes de facturar")}</h3>
        <p>${pendientes.length ? `<label style="margin-right:14px"><input type="checkbox" id="fac-todos" /> ${t("seleccionar_todos_n", "Seleccionar todos ({n})", { n: pendientes.length })}</label>` : ""}
           <button id="fac-sel" ${seleccion.size ? "" : "disabled"}>${t("facturar_seleccionados_n", "Facturar seleccionados ({n})", { n: seleccion.size })}</button>
           <span id="fac-msg" style="margin-left:12px"></span></p>
        ${Object.keys(porCliente).length ? Object.values(porCliente).map((g) => `
          <h4 style="margin:14px 0 4px"><label title="${t("titulo_sel_todos_cliente", "Seleccionar todos los albaranes de este cliente")}" style="font-weight:normal"><input type="checkbox" data-fac-cliente="${g.cliente.id}" /></label>
            ${escapeHtml(etiquetaCliente(g.cliente))}
            <button data-fac-todo="${g.cliente.id}" style="margin-left:10px">${t("facturar_todo_pendiente_n", "Facturar todo lo pendiente ({n})", { n: g.repartos.length })}</button></h4>
          <table><thead><tr><th></th><th>${t("th_albaran", "Albarán")}</th><th>${t("th_fecha", "Fecha")}</th><th>${t("th_lineas", "Líneas")}</th><th>${t("th_base", "Base")}</th><th>${t("th_total", "Total")}</th></tr></thead>
            <tbody>${g.repartos.map((r) => `<tr>
              <td><input type="checkbox" data-fac-sel="${r.id}" ${seleccion.has(r.id) ? "checked" : ""} /></td>
              <td><code>${escapeHtml(r.numero)}</code></td><td>${fechaLocal(r.fecha)}</td>
              <td>${resumenLineas(r)}</td>
              <td>${euros(r.base_centimos)}${r.lineas.some((l) => l.precio_unitario_centimos === 0 && l.tipo !== "componente") ? ` <span style="color:#e0a030">⚠ ${t("linea_sin_precio", "línea sin precio")}</span>` : ""}</td>
              <td><b>${euros(r.total_centimos)}</b></td></tr>`).join("")}</tbody></table>`).join("")
          : `<p style="color:#9a8f7d">${t("sin_albaranes_pendientes_facturar", "No hay albaranes pendientes de facturar.")}</p>`}
        <h3>${t("facturas_emitidas", "Facturas emitidas")}</h3>
        ${tablaFacturas(facturas, true)}`;

      cont.querySelector("#ir-empresa").onclick = () => irATab("empresa");
      const selEmisor = cont.querySelector("#fac-emisor");
      if (selEmisor) selEmisor.onchange = () => { estado.emisorFacturar = selEmisor.value; };
      cont.querySelector("#fac-factor").onchange = async (e) => {
        const factor = Number(e.target.value);
        await api("/almacen/configuracion", { method: "PATCH", body: JSON.stringify({ factor_piezas: factor }) });
        estado.factorPiezas = factor;
      };
      async function facturar(clienteId, repartoIds) {
        const msg = () => document.getElementById("fac-msg");
        async function intentar(permitir) {
          return api("/facturas", { method: "POST", body: JSON.stringify({
            cliente_id: clienteId, reparto_ids: repartoIds, permitir_lineas_a_cero: permitir,
            emisor_id: estado.emisorFacturar ? Number(estado.emisorFacturar) : null }) });
        }
        try {
          let f;
          try { f = await intentar(false); }
          catch (e) {
            if (!String(e.message).startsWith("Hay lineas sin precio")) throw e;
            if (!await confirmar(t("confirmar_facturar_a_cero", "{mensaje}\n\n¿Facturar igualmente esas líneas a 0 € (por ejemplo, si son gratuitas)?", { mensaje: e.message }))) return;
            f = await intentar(true);
          }
          seleccion.clear();
          await pintar();
          if (msg()) msg().textContent = t("emitida_por", "Emitida {numero} por {total}.", { numero: f.numero, total: euros(f.total_centimos) });
        } catch (e) { if (msg()) msg().textContent = e.message; else avisar(e.message); }
      }
      // Seleccion: por albaran, por cliente y todos a la vez. Las casillas de cliente y "todos"
      // quedan marcadas, a medias o vacias segun lo elegido; la seleccion sobrevive al repintado.
      const idsPorCliente = {};
      pendientes.forEach((r) => { (idsPorCliente[r.cliente_id] = idsPorCliente[r.cliente_id] || []).push(r.id); });
      function marca(chk, ids) {
        const n = ids.filter((id) => seleccion.has(id)).length;
        chk.checked = ids.length > 0 && n === ids.length;
        chk.indeterminate = n > 0 && n < ids.length;
      }
      function sincronizar() {
        const b = cont.querySelector("#fac-sel");
        b.disabled = seleccion.size === 0; b.textContent = t("facturar_seleccionados_n", "Facturar seleccionados ({n})", { n: seleccion.size });
        cont.querySelectorAll("[data-fac-sel]").forEach((c) => { c.checked = seleccion.has(Number(c.dataset.facSel)); });
        cont.querySelectorAll("[data-fac-cliente]").forEach((c) => marca(c, idsPorCliente[c.dataset.facCliente] || []));
        const todos = cont.querySelector("#fac-todos");
        if (todos) marca(todos, pendientes.map((r) => r.id));
      }
      function fijar(ids, marcado) { ids.forEach((id) => { if (marcado) seleccion.add(id); else seleccion.delete(id); }); sincronizar(); }
      cont.querySelectorAll("[data-fac-sel]").forEach((chk) => {
        chk.onchange = () => fijar([Number(chk.dataset.facSel)], chk.checked);
      });
      cont.querySelectorAll("[data-fac-cliente]").forEach((chk) => {
        chk.onchange = () => fijar(idsPorCliente[chk.dataset.facCliente] || [], chk.checked);
      });
      const todosChk = cont.querySelector("#fac-todos");
      if (todosChk) todosChk.onchange = () => fijar(pendientes.map((r) => r.id), todosChk.checked);
      sincronizar();
      cont.querySelectorAll("[data-fac-todo]").forEach((btn) => {
        btn.onclick = () => facturar(Number(btn.dataset.facTodo), null);
      });
      cont.querySelector("#fac-sel").onclick = async () => {
        // una factura por cliente con lo seleccionado de cada uno
        const porCli = {};
        pendientes.filter((r) => seleccion.has(r.id)).forEach((r) => { (porCli[r.cliente_id] = porCli[r.cliente_id] || []).push(r.id); });
        for (const [cid, ids] of Object.entries(porCli)) await facturar(Number(cid), ids);
      };
      enlazarFacturas(cont, facturas, pintar);
    }
    await pintar();
  }

  async function renderFacturas() {
    const cont = document.getElementById("contenido");
    async function pintar() {
      const facturas = await api("/facturas?limite=200");
      cont.innerHTML = `<h2>${t("tab_facturas", "Facturas")}</h2>
        <p class="ayuda">${t("ayuda_facturas", 'Las facturas emitidas a tu empresa. "Ver / imprimir" abre la factura lista para imprimir o guardar como PDF. Si una factura se corrige, verás su rectificativa (RECT) y la nueva factura.')}</p>

      enlazarFacturas(cont, facturas, pintar);

    await pintar();
