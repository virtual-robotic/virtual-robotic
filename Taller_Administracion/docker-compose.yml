# Version: 2026-09-27 18:14 -- monta requirements-dev.txt para poder instalar pytest dentro
services:
  admin_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taller_admin_api
    hostname: taller_admin_api
    volumes:
      - ./app:/workspace/app
      - ./data:/workspace/data
      - ./tests:/workspace/tests
      - ./pytest.ini:/workspace/pytest.ini
      - ./requirements-dev.txt:/workspace/requirements-dev.txt:ro   # para "pip install -r requirements-dev.txt" (DETALLE_TECNICO)
      - ..:/workspace/repo:ro
    ports:
      - "8000:8000"
    environment:
      - TALLER_DB_PATH=/workspace/data/taller.db
      - TALLER_DEV_MODE=true
      - TALLER_REPO_DIR=/workspace/repo
      # Vacio = sin recarga automatica (lo normal). Ver el comentario del Dockerfile.
      - TALLER_RELOAD=${TALLER_RELOAD:-}
