    --pair-b: #3552c9;   /* 3 / 5 */
    --pair-c: #1f8f74;   /* 4 / 6 */
    --pair-a-fill: rgba(180, 121, 31, 0.16);
    --pair-b-fill: rgba(53, 82, 201, 0.14);
    --pair-c-fill: rgba(31, 143, 116, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101817;
      --surface: #182322;
      --text: #eee7da;
      --text-muted: #9fb0ac;
      --line: rgba(238,231,218,0.14);
      --accent: #c9683c;
      --pair-a: #e0a94f;
      --pair-b: #7d94ea;
      --pair-c: #4fbc9e;
      --pair-a-fill: rgba(224, 169, 79, 0.16);
      --pair-b-fill: rgba(125, 148, 234, 0.16);
      --pair-c-fill: rgba(79, 188, 158, 0.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101817;
    --surface: #182322;
    --text: #eee7da;
    --text-muted: #9fb0ac;
    --line: rgba(238,231,218,0.14);
    --accent: #c9683c;
    --pair-a: #e0a94f;
    --pair-b: #7d94ea;
    --pair-c: #4fbc9e;
    --pair-a-fill: rgba(224, 169, 79, 0.16);
    --pair-b-fill: rgba(125, 148, 234, 0.16);
    --pair-c-fill: rgba(79, 188, 158, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }

  main {
    width: 100%;
    max-width: 760px;
  }

  h1 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(1.4rem, 1rem + 1.4vw, 1.9rem);
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 6px;
  }

  .migas {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.78rem; letter-spacing: 0.02em;
    margin: 0 0 1.6rem;
  }
  .migas a { color: var(--text-muted); text-decoration: none; }
  .migas a:hover { color: var(--text); }
  .migas-sep { color: var(--text-muted); opacity: 0.6; margin: 0 0.35em; }
  .migas-actual { color: var(--accent); font-weight: 600; }

  p.lede {
    color: var(--text-muted);
    font-size: 1rem;
    line-height: 1.55;

  .legend {
    display: flex;

  figure {

  svg { display: block; width: 100%; height: auto; }

  .pairs {
    margin-top: 20px;

  .pair-card .l { display: block; margin-top: 2px; font-family: 'Archivo', sans-serif; font-weight: 400; font-style: italic; color: var(--text-muted); font-size: 0.78rem; }

<main>
  <nav class="migas" aria-label="Ruta">
    <a href="/">Principal</a>
    <span class="migas-sep">→</span>
    <a href="/manual/lanzar">Cómo arranca todo</a>
    <span class="migas-sep">→</span>
    <span class="migas-actual" aria-current="page">Caras opuestas del cubo</span>
  </nav>

  <h1>Numeración de caras: 1 arriba, 2 abajo, 3‑4‑5‑6 alrededor</h1>
  <p class="lede">
    Convención para hablar de qué caras agarra la pinza: la cara de arriba es
    <strong style="color:var(--pair-a)">1</strong>, la de abajo (opuesta) es
    <strong style="color:var(--pair-a)">2</strong>, y las cuatro caras laterales
    se numeran <strong style="color:var(--pair-b)">3</strong>,
    <strong style="color:var(--pair-c)">4</strong>,
    <strong style="color:var(--pair-b)">5</strong>,
    <strong style="color:var(--pair-c)">6</strong> en orden dando la vuelta.
  </p>

  <figure>
    <div class="diagrams">
      <svg viewBox="0 0 300 300" role="img" aria-label="Cubo en perspectiva isometrica con la cara de arriba marcada 1 y dos caras laterales visibles marcadas 3 y 4">
        <!-- top face: N E S W -->
        <polygon class="face-edge" points="150,40 236.6,90 150,140 63.4,90" fill="var(--pair-a-fill)"/>
        <!-- left visible face: S W W' S' -->
        <polygon class="face-edge" points="150,140 63.4,90 63.4,190 150,240" fill="var(--pair-b-fill)"/>
        <!-- right visible face: S E E' S' -->
        <polygon class="face-edge" points="150,140 236.6,90 236.6,190 150,240" fill="var(--pair-c-fill)"/>

        <text x="150" y="88" text-anchor="middle" font-size="26">1</text>
        <text x="98" y="172" text-anchor="middle" font-size="26">3</text>
        <text x="200" y="172" text-anchor="middle" font-size="26">4</text>

        <text x="150" y="272" text-anchor="middle" class="hidden-note" font-size="13">2, 5 y 6 quedan ocultas aqui —</text>
        <text x="150" y="288" text-anchor="middle" class="hidden-note" font-size="13">ver el desarrollo plano</text>
      </svg>

      <svg viewBox="0 0 400 300" role="img" aria-label="Desarrollo plano del cubo mostrando las seis caras: 1 arriba y 2 abajo plegadas sobre la cara 3, con 3, 4, 5 y 6 en tira consecutiva">
        <!-- belt: 3,4,5,6 -->
        <rect class="face-edge" x="40"  y="100" width="80" height="80" fill="var(--pair-b-fill)"/>
        <rect class="face-edge" x="120" y="100" width="80" height="80" fill="var(--pair-c-fill)"/>
        <rect class="face-edge" x="200" y="100" width="80" height="80" fill="var(--pair-b-fill)"/>
        <rect class="face-edge" x="280" y="100" width="80" height="80" fill="var(--pair-c-fill)"/>
        <!-- top (1) folds up from 3, bottom (2) folds down from 3 -->
        <rect class="face-edge" x="40" y="20"  width="80" height="80" fill="var(--pair-a-fill)"/>
        <rect class="face-edge" x="40" y="180" width="80" height="80" fill="var(--pair-a-fill)"/>

        <text x="80"  y="70"  text-anchor="middle" font-size="26">1</text>
        <text x="80"  y="150" text-anchor="middle" font-size="26">3</text>
        <text x="160" y="150" text-anchor="middle" font-size="26">4</text>
        <text x="240" y="150" text-anchor="middle" font-size="26">5</text>
        <text x="320" y="150" text-anchor="middle" font-size="26">6</text>
        <text x="80"  y="230" text-anchor="middle" font-size="26">2</text>
      </svg>
    </div>

    <figcaption>
      <strong>Desarrollo plano (derecha):</strong> al doblar la tira 3‑4‑5‑6
      alrededor y plegar 1 y 2 hacia arriba/abajo se reconstruye el cubo. Así
      quedan enfrentadas <strong>3 con 5</strong> y <strong>4 con 6</strong>,
      igual que <strong>1 queda enfrentada a 2</strong>.
      <div class="pairs">
        <div class="pair-card"><span class="n" style="color:var(--pair-a)">1 · 2</span><span class="l">arriba / abajo</span></div>
        <div class="pair-card"><span class="n" style="color:var(--pair-b)">3 · 5</span><span class="l">opuestas</span></div>
        <div class="pair-card"><span class="n" style="color:var(--pair-c)">4 · 6</span><span class="l">opuestas</span></div>
      </div>
    </figcaption>
  </figure>
</main>
